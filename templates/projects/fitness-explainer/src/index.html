<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="_studio/studio-base.css">
  <link rel="stylesheet" href="_studio/styles/{{STYLE}}.css">
  <style id="studio-format">:root{--w:1280px;--h:720px;--u:7.2px;--safe-top:43px;--safe-right:64px;--safe-bottom:58px;--safe-left:64px;}</style>
  <style>
    /* Sinew fitness starter. Fonts named literally so HyperFrames injects them: 'Outfit', 'Inter', 'JetBrains Mono'. */
    #stage { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); font-family: 'Outfit', 'Inter', sans-serif; }
  </style>
  <script src="_studio/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root"
     data-composition-id="root"
     data-format="landscape"
     data-width="1280"
     data-height="720"
     data-fps="30"
     data-duration="16">
  <svg id="stage" viewBox="0 0 1280 720" aria-hidden="true"></svg>
</div>

<script src="_studio/studio-core.js"></script>
<script src="_studio/studio-draw.js"></script>
<script src="_studio/studio-type.js"></script>
<script src="_studio/studio-motion.js"></script>
<script src="_studio/studio-compositions.js"></script>
<!-- Sinew fitness kit: rig engine, brand palette, Tibi (Cobalt Sculpt: generated shapes, then the painter),
     movement library, anatomy, brand graphics, generated library data -->
<script src="_studio/studio-rig.js"></script>
<script src="_studio/kits/fitness/brand.js"></script>
<script src="_studio/kits/fitness/sculpt-data.js"></script>
<script src="_studio/kits/fitness/sculpt.js"></script>
<script src="_studio/kits/fitness/exercises.js"></script>
<script src="_studio/kits/fitness/anatomy.js"></script>
<script src="_studio/kits/fitness/graphics.js"></script>
<script src="_studio/kits/fitness/library.js"></script>
<script src="captions.js"></script>
<script>
Studio.build(function (tl, f, S) {
  // Scene cues mirror storyboard.json; replace with measured narration times.
  var cue = S.cues({ s1: 0, s2: 4.4, s3: 8.8, s4: 13.2, end: 16 });
  var caps = S.comp.captions(document.getElementById('root'), window.STUDIO_CAPTIONS || []);
  var K = S.kit.fitness, G = K.graphics;
  var stage = document.getElementById('stage');

  // World: the gym, Tibi (Cobalt Sculpt; gender 'male' or 'female') on the floor line, bodyweight
  // squats from frame 0 (the mascot never freezes). Rig moves on one Tibi go in time order.
  var gym = G.env.gym(stage, { w: 1280, h: 720, floor: 600 });
  var tibi = K.sculpt(stage, { gender: 'male', view: 'side', x: 760, floor: gym.floor, scale: 1.05 });
  function squats(at, n) {
    var t = at;
    for (var i = 0; i < n; i++) {
      t = tibi.to(tl, 'squat', t, 1.1, { ease: 'power2.inOut' });
      t = tibi.to(tl, 'stand', t + 0.15, 1.0, { ease: 'sine.inOut' });
    }
    return t;
  }
  var ui = S.svg('g', {}, stage);
  var title = G.titleCard(ui, { x: 64, y: 210, kicker: 'Sinew', title: '{{TITLE}}', size: 52, align: 'left' });
  var badge = G.evidenceBadge(ui, { x: 64, y: 300, grade: 'established' });
  var cite = G.citation(ui, { x: 64, y: 660, text: 'Replace with: Author et al. year · design · n' });

  title.show(tl, cue('s1', 0.2));
  var t = squats(0.3, 2);
  // activation: the generator's squat set (coral prime movers, marigold secondary, pale stabilisers);
  // a map works too, e.g. {quadriceps: 3, 'gluteus-maximus': 3, hamstrings: 2}
  tibi.activate(tl, 'squat', cue('s2'), 0.6);
  badge.show(tl, cue('s2', 0.8));
  squats(Math.max(t, cue('s2', 0.6)), 2);
  cite.show(tl, cue('s3'));
  tibi.activate(tl, null, cue('s4'), 0.6);
  title.hide(tl, cue('s4', 1));

  caps.schedule(tl);
});
</script>
</body>
</html>
