<!doctype html>
<html><head><meta charset="utf-8"><title>Tibi anatomy bench</title>
<style>html,body{margin:0;background:#F6F3EC}</style>
<script src="../../../src/studio/vendor/three.min.js"></script>
<script src="../../../src/studio/kits/fitness/brand.js"></script>
<script src="../../../src/studio/kits/fitness/tibi3d.js"></script>
<script src="../../../src/studio/kits/fitness/anatomy3d.js"></script>
<script src="../../../src/studio/kits/fitness/exercises3d.js"></script>
</head><body><div id="h"></div>
<script>
/* Anatomy still bench (scripts/anatomy3d-bench.py drives it; the headless Chrome screenshot is the product).
 *   ?g=m|f &w= &h= &az= &el= &dist= &fov= &tx= &ty= &tz=
 *   &ex=squat&t=1.2          pose from a 3D exercise at film time t (its own camera unless az/el/dist/tx/ty/tz are given)
 *   &p.sh L=40 ...           raw pose keys, e.g. p.shL=80&p.elL=100&p.hlL=30
 *   &acts=glute:3:1,quad:3:0.7   muscle:role(1 stabiliser 2 secondary 3 prime):amount 0..1 (surface activation)
 *   &cut=calf:2,glute:1      cut windows: name:open (1 = skin out, 2 = superficial layer out too)
 *   &hi=calf:1               highlight a muscle inside the body (cutaway/isolated); &view=ghost:0.8,layer:1,skel:1,effort:1; &iso=calf:1
 */
var q = new URLSearchParams(location.search), W = +(q.get('w') || 480), H = +(q.get('h') || 640);
var T3 = Studio.kit.fitness.t3d;
var st = T3.stage(document.getElementById('h'), { width: W, height: H });
var fig, v = {}, def = null;
if (q.get('ex')) {
  var sc = T3.scene(st, q.get('ex'), { gender: q.get('g') || 'm', reps: 2 });
  fig = sc.fig; v = sc.motion.at(+(q.get('t') || 0)); def = sc.def;
} else {
  fig = st.tibi({ gender: q.get('g') || 'm' });
  v = JSON.parse(JSON.stringify(T3.DEFAULT_POSE));
  st.cam.ty = 380; st.cam.dist = 2300; st.cam.az = 20; st.cam.el = 8;
}
q.forEach(function (val, k) { if (k.indexOf('p.') === 0) v[k.slice(2)] = +val; });
var acts = (q.get('acts') || '').split(',').filter(Boolean), roles = {};
acts.forEach(function (a) { var s = a.split(':'); roles[s[0]] = +(s[1] || 3); v['act.' + s[0]] = +(s[2] === undefined ? 1 : s[2]); });
if (acts.length) fig.roles(Object.assign({}, def ? def.acts : {}, roles));
(q.get('cut') || '').split(',').filter(Boolean).forEach(function (c) { var s = c.split(':'); v['cut.' + s[0]] = +(s[1] || 1); });
(q.get('hi') || '').split(',').filter(Boolean).forEach(function (c) { var s = c.split(':'); v['hi.' + s[0]] = +(s[1] || 1); });
(q.get('iso') || '').split(',').filter(Boolean).forEach(function (c) { var s = c.split(':'); v['iso.' + s[0]] = +(s[1] || 1); });
if (q.get('view')) q.get('view').split(',').forEach(function (c) { var s = c.split(':'); v['view.' + s[0]] = +(s[1] || 1); });
var c = st.cam;
['az', 'el', 'dist', 'fov', 'tx', 'ty', 'tz'].forEach(function (k) { if (q.get(k) !== null) c[k] = +q.get(k); });
fig.apply(v); st.render();
document.title = 'ready';
</script></body></html>
