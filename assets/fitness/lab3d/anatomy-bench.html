<!doctype html>
<html><head><meta charset="utf-8"><title>Tibi anatomy bench</title>
<style>html,body{margin:0;background:#F6F3EC}</style>
<script src="../../../src/studio/vendor/three.min.js"></script>
<script src="../../../src/studio/kits/fitness/brand.js"></script>
<script src="../../../src/studio/kits/fitness/tibi3d.js"></script>
<script src="../../../src/studio/kits/fitness/anatomy3d.js"></script>
<script src="../../../src/studio/kits/fitness/exercises3d.js"></script>
</head><body><div id="h"></div>
<script>
/* Anatomy still bench (scripts/anatomy3d-bench.py drives it; the headless Chrome screenshot is the product).
 *   ?g=m|f &w= &h= &az= &el= &dist= &fov= &tx= &ty= &tz=
 *   &ex=squat&t=1.2          pose from a 3D exercise at film time t (its own camera unless az/el/dist/tx/ty/tz are given)
 *   &p.shL=40 ...            raw pose keys, e.g. p.shL=80&p.elL=100&p.hlL=30
 *   &id=audit&profile=distance   named figure; integrated anatomy (legacy is a compatibility reference)
 *   &phase=0..4             midpoint of an exercise's actual phaseMap, fixed 3.4 s rep
 *   &history=1              visit a different pose/mode before returning to the target
 *   &shade=clay             neutral surface diagnostic; no cutaway/ghost interpretation
 *   &shade=crescent         opt-in crescent planes (T3.anatomy.shade, look prototype); works with every mode
 *   &acts=glute:3:1,quad:3:0.7   muscle:role(1 stabiliser 2 secondary 3 prime):amount 0..1 (surface activation)
 *   &cut=calf:2,glute:1      cut windows: name:open (1 = skin out, 2 = superficial layer out too)
 *   &hi=calf:1               highlight a muscle inside the body (cutaway/isolated); &view=ghost:0.8,layer:1,skel:1,effort:1; &iso=calf:1
 */
var q = new URLSearchParams(location.search), W = +(q.get('w') || 480), H = +(q.get('h') || 640);
var T3 = Studio.kit.fitness.t3d;
// &tune={"CORRECTIVE":{"arc":null}}: diagnostic override of T3.anatomy tables before the body is built (A/B a fix in pictures); &rig= does the same for T3 (e.g. GIRDLE)
if (q.get('tune')) (function merge(dst, src) {
  Object.keys(src).forEach(function (k) {
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && dst[k] && typeof dst[k] === 'object') merge(dst[k], src[k]);
    else dst[k] = src[k];
  });
})(T3.anatomy, JSON.parse(q.get('tune')));
// &rig={"GIRDLE":{"rhythm":0.4}}: the same diagnostic override for the rig's tables (T3.GIRDLE and friends)
if (q.get('rig')) (function merge(dst, src) {
  Object.keys(src).forEach(function (k) {
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && dst[k] && typeof dst[k] === 'object') merge(dst[k], src[k]);
    else dst[k] = src[k];
  });
})(T3, JSON.parse(q.get('rig')));
var st = T3.stage(document.getElementById('h'), { width: W, height: H });
var fig, v = {}, def = null, id = q.get('id') || '', pre = id ? id + '.' : '';
var profile = q.get('profile') || 'distance';
if (q.get('ex')) {
  var sc = T3.scene(st, q.get('ex'), { gender: q.get('g') || 'm', figId: id, profileSampling: profile, reps: 2, period: q.has('phase') ? 3.4 : undefined });
  fig = sc.fig; v = sc.motion.at(+(q.get('t') || 0)); def = sc.def;
  if (q.has('phase')) {
    var phase = def.phaseMap[+q.get('phase')];
    if (!phase) throw new Error('Unknown phase index: ' + q.get('phase'));
    v = sc.motion.at((phase.a + phase.b) * 0.5 * 3.4);
  }
} else {
  fig = st.tibi({ gender: q.get('g') || 'm', id: id, profileSampling: profile });
  Object.keys(fig.defaultPose).forEach(function (k) { v[pre + k] = fig.defaultPose[k]; });
  st.cam.ty = 380; st.cam.dist = 2300; st.cam.az = 20; st.cam.el = 8;
}
q.forEach(function (val, k) { if (k.indexOf('p.') === 0) v[pre + k.slice(2)] = +val; });
var acts = (q.get('acts') || '').split(',').filter(Boolean), roles = {};
acts.forEach(function (a) { var s = a.split(':'); roles[s[0]] = +(s[1] || 3); v[pre + 'act.' + s[0]] = +(s[2] === undefined ? 1 : s[2]); });
if (acts.length) fig.roles(Object.assign({}, def ? def.acts : {}, roles));
if (q.get('mode') === 'normal') Object.keys(v).forEach(function (k) {
  if (k.indexOf(pre + 'act.') === 0) v[k] = 0;
});
(q.get('cut') || '').split(',').filter(Boolean).forEach(function (c) { var s = c.split(':'); v[pre + 'cut.' + s[0]] = +(s[1] || 1); });
(q.get('hi') || '').split(',').filter(Boolean).forEach(function (c) { var s = c.split(':'); v[pre + 'hi.' + s[0]] = +(s[1] || 1); });
(q.get('iso') || '').split(',').filter(Boolean).forEach(function (c) { var s = c.split(':'); v[pre + 'iso.' + s[0]] = +(s[1] || 1); });
if (q.get('view')) q.get('view').split(',').forEach(function (c) { var s = c.split(':'); v[pre + 'view.' + s[0]] = +(s[1] || 1); });
var c = st.cam;
['az', 'el', 'dist', 'fov', 'tx', 'ty', 'tz'].forEach(function (k) { if (q.get(k) !== null) c[k] = +q.get(k); });
if (q.get('shade') === 'clay') {
  if (q.has('cut') || q.has('view') || q.has('iso')) throw new Error('Clay does not represent anatomy modes');
  fig.body.skin.material = new THREE.MeshPhongMaterial({color: '#8D9CAD', specular: '#26354A', shininess: 18, side: THREE.DoubleSide});
} else if (q.get('shade') === 'crescent') {
  T3.anatomy.shade(fig, 'crescent');
} else if (q.has('shade') && q.get('shade') !== 'normal') {
  throw new Error('Unknown diagnostic shade: ' + q.get('shade'));
}
if (q.get('history') === '1') {
  var prior = {}; prior[pre + 'shL'] = 175; prior[pre + 'elR'] = 150;
  prior[pre + 'view.ghost'] = 1; prior[pre + 'view.layer'] = 1;
  fig.apply(prior); st.render();
}
fig.apply(v); st.render();
document.title = 'ready';
</script></body></html>
