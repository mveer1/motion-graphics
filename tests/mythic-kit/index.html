<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mythic kit self-test</title>
  <link rel="stylesheet" href="/src/studio/studio-base.css">
  <link rel="stylesheet" href="/src/studio/styles/mythic-paper.css">
  <style>:root{--w:720px;--h:1280px;--u:7.2px;--safe-top:128px;--safe-right:72px;--safe-bottom:300px;--safe-left:43px;}</style>
  <script src="/src/studio/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="root" data-format="portrait" data-width="720" data-height="1280" data-fps="30" data-duration="12">
  <div class="st-layer" id="world"></div>
  <section class="st-scene" id="s1"></section>
</div>
<script src="/src/studio/studio-core.js"></script>
<script src="/src/studio/studio-draw.js"></script>
<script src="/src/studio/studio-type.js"></script>
<script src="/src/studio/studio-motion.js"></script>
<script src="/src/studio/studio-compositions.js"></script>
<script src="/src/studio/kits/mythic/mythic.js"></script>
<script src="/src/studio/kits/mythic/figures.js"></script>
<script src="/src/studio/kits/mythic/figures-human.js"></script>
<script src="/src/studio/kits/mythic/armoury.js"></script>
<script src="/tests/mythic-kit/measure.js"></script>
<script>
// Exercises every Studio.kit.mythic builder and motion helper; tests/test-mythic.py reads window.__mythicResults.
var PIXEL = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="60"><rect width="40" height="60" fill="#865"/><circle cx="20" cy="22" r="10" fill="#fff"/></svg>');
Studio.build(function (tl, f, S) {
  var M = S.kit.mythic, world = document.getElementById('world'), s1 = document.getElementById('s1');
  var stage = M.stage(world);
  var lamp = M.lamp(world, { x: 0.5, y: 0.4 });
  var sheets = ['rect', 'hills', 'peaks', 'waves', 'clouds', 'disc', 'niche', 'arch', 'flames', 'lotus'].map(function (shape, i) {
    return M.sheet(stage.layer(i % 6), { shape: shape, x: 10 + i * 20, y: 40 + i * 60, w: S.u(30), h: S.u(16), fill: '--c-accent', seed: 100 + i });
  });
  var plates = ['rect', 'niche', 'disc', 'cutout'].map(function (frame, i) {
    return M.plate(stage.layer(3), { src: PIXEL, frame: frame, x: 40 + i * 150, y: 900, w: S.u(18), h: S.u(26), seed: 200 + i });
  });
  var halos = ['nimbus', 'prabhavali', 'mandorla', 'sun'].map(function (kind, i) {
    return M.halo(stage.layer(2), { kind: kind, x: 120 + i * 160, y: 300, r: S.u(8) });
  });
  var borders = ['meander', 'lotus', 'knot', 'beads', 'zigzag'].map(function (motif, i) {
    return M.border(world, { motif: motif, inset: 1 + i * 4, band: 2 });
  });
  var doors = M.doors(s1, { x: 100, y: 500, w: 300, h: 300 });
  var panel = S.el('div', null, 'panel');
  var scroll = M.scroll(s1, { x: 60, y: 820, w: 600, h: 120, content: panel });
  var hero = M.puppet(stage.layer(3), { x: 300, y: 500, h: S.u(40), look: 'leather', seed: 7 });
  var shade = M.puppet(stage.layer(3), { x: 100, y: 500, h: S.u(40), look: 'silhouette', seed: 8 });
  var cart = M.cartouche(s1, { title: 'The Valmiki Ramayana', plate: true });
  var title = M.title(s1, { kicker: 'A tale retold', title: 'The churning of the ocean', sub: 'Samudra manthan', plate: true });
  var credit = M.credit(s1, 'The Met, 38158 - Public domain');
  var gold = M.gold(S.u(20));
  var figs = [];
  M.figureIds.forEach(function (id, i) {
    ['silhouette', 'leather', 'paper', 'painted'].forEach(function (look, j) {
      figs.push(M.puppet(stage.layer(1), { figure: id, look: look, h: S.u(12), x: 10 + i * 80, y: 1000 + j * 60, seed: 50 + i * 4 + j }));
    });
  });
  var walker = M.puppet(stage.layer(4), { figure: 'hanuman', look: 'leather', h: S.u(30), x: 400, y: 200 });
  var frz = M.frieze(s1, { x: 20, y: 40, w: 600, h: 120, panels: 5, visible: 3 });
  var regs = M.registers(s1, { x: 20, y: 200, w: 600, h: 300, rows: 3, order: 'bottom-up' });
  var tradBorders = Object.keys(M.traditions).map(function (t) { return M.border(world, { tradition: t, inset: 30, band: 1.5 }); });
  window.__mythic = { sheets: sheets, plates: plates, halos: halos, hero: hero, figs: figs, walker: walker, frz: frz, regs: regs, tradBorders: tradBorders };

  S.show(tl, '#s1', 0);
  M.flicker(tl, lamp, 0, 12, { fps: 6, seed: 3 });
  M.lampTo(tl, lamp, 6, { x: 0.3, y: 0.6 });
  M.place(tl, sheets, 0.2, { stagger: 0.1 });
  M.place(tl, plates, 1.0);
  halos.forEach(function (h, i) { M.haloIn(tl, h, 1.5 + i * 0.2); M.turn(tl, h, 2, 12, { degrees: 20 }); });
  borders.forEach(function (b, i) { M.borderIn(tl, b, 0.1 * i); });
  M.open(tl, doors, 2);
  M.unroll(tl, scroll, 2.5);
  M.rise(tl, hero, 3);
  M.pose(tl, hero, 4, { 'arm-front': -60, head: 5 });
  M.pose(tl, hero, 5, { 'arm-front': -10 });
  M.sway(tl, shade, 3, 12, { degrees: 2 });
  M.breathe(tl, hero, 4.5, 12);
  M.cartoucheIn(tl, cart, 0.5);
  M.titleIn(tl, title, 0.8);
  M.lift(tl, [title.el, cart.el], 7);
  M.glint(tl, gold, 3);
  M.glint(tl, halos[0].gold, 4);
  M.tint(tl, world, 6, 9);
  M.shower(tl, world, 7, 11.8, { count: 12, seed: 5 });
  M.shower(tl, world, 7, 11.8, { count: 6, kind: 'ember', seed: 6 });
  tl.fromTo(credit, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, immediateRender: true }, 8);
  M.pose(tl, walker, 1, { 'arm-front': -90, 'leg-front': -30 }, { duration: 1, steps: 12 });
  M.panelsIn(tl, frz, 0.5, { stagger: 0.2 });
  M.friezeTo(tl, frz, 2, 4);
  M.friezeTo(tl, frz, 5, 0);
  M.panelsIn(tl, regs, 1, { from: 'bottom' });
  M.place(tl, figs, 0.3, { stagger: 0.01, steps: true });
});

// Test harness only (never in a composition): waits for the build, then checks seeking and state.
(function waitAndCheck() {
  var root = document.getElementById('root');
  function snapshot() {
    var els = document.querySelectorAll('.mx-piece > svg, .mx-body, [data-part], .mx-lamp, .mx-vignette, .mx-leaf, .mx-w, .mx-cartouche, .mx-title');
    return Array.prototype.map.call(els, function (e) {
      var cs = getComputedStyle(e);
      var tr = cs.transform === 'matrix(1, 0, 0, 1, 0, 0)' ? 'none' : cs.transform;   // identity == none, same pixels
      return [e.getAttribute('transform') || '', tr, cs.opacity, cs.visibility].join('|');
    }).join(';');
  }
  function geometry() {
    return Array.prototype.map.call(document.querySelectorAll('path'), function (p) { return p.getAttribute('d') || ''; }).join('|');
  }
  function run() {
    var results = [];
    var check = function (name, ok, detail) { results.push({ name: name, ok: !!ok, detail: detail || '' }); };
    var tl = window.__timelines && window.__timelines.root;
    check('build registered the timeline', !!tl && root.getAttribute('data-studio-ready') === 'true', root.getAttribute('data-studio-error') || '');
    if (!tl) { window.__mythicResults = { results: results }; return; }
    check('timeline fits data-duration', tl.duration() <= 12 + 1e-3, String(tl.duration()));
    tl.seek(5, false); var a = snapshot();
    tl.seek(11, false); tl.seek(0.5, false); tl.seek(5, false); var b = snapshot();
    var diffs = [];
    a.split(';').forEach(function (v, i) { var w = b.split(';')[i]; if (v !== w) diffs.push(i + ': ' + v + ' != ' + w); });
    check('seeking back and forth renders the same frame', a === b, diffs.slice(0, 4).join(' / '));
    tl.seek(0, false);
    var hidden = window.__mythic.sheets.every(function (s) { return getComputedStyle(s.art).visibility === 'hidden' || parseFloat(getComputedStyle(s.art).opacity) === 0; });
    check('placed sheets are hidden before their entrance', hidden);
    tl.seek(3, false);
    var shown = window.__mythic.sheets.every(function (s) { return parseFloat(getComputedStyle(s.art).opacity) > 0.99; });
    check('placed sheets are visible after their entrance', shown);
    var leather = getComputedStyle(window.__mythic.hero.part('torso').querySelector('path')).fill;
    check('leather puppet resolves a non-black fill', leather && leather !== 'rgb(0, 0, 0)', leather);
    check('every shape produced a path', window.__mythic.sheets.every(function (s) { return (s.path.getAttribute('d') || '').length > 20; }));
    check('every plate holds its image', window.__mythic.plates.every(function (p) { return p.image && p.image.getAttribute('href'); }));
    check('halo exposes its gold fill', /^url\(#mx-gold-/.test(window.__mythic.halos[0].gold));
    var m = window.__mythic, Mk = Studio.kit.mythic;
    check('every figure builds in every look', m.figs.length === Mk.figureIds.length * 4 && m.figs.every(function (p) { return p.meta && p.meta.name && p.meta.tradition && Object.keys(p.groups).length >= 5; }));
    check('figures carry hand and head joints for posing', ['rama', 'hanuman', 'shiva', 'athena', 'odin'].every(function (id) { var p = Mk.puppet(document.createElement('div'), { figure: id }); return p.part('head') && p.part('hand-front') && p.part('arm-back'); }));
    var rots = [];
    for (var t = 1.0; t <= 2.0001; t += 1 / 60) { tl.seek(t, false); rots.push(Math.round(gsap.getProperty(m.walker.part('arm-front'), 'rotation') * 1000)); }
    var distinct = rots.filter(function (v, i) { return i === 0 || v !== rots[i - 1]; }).length;
    check('steps: true holds poses (12 steps a second, not 60)', distinct >= 11 && distinct <= 14, String(distinct));
    tl.seek(2.8, false);
    check('frieze travels to a panel', Math.abs(gsap.getProperty(m.frz.track, 'x')) > 1);
    check('registers read bottom-up', m.regs.rows[0].y > m.regs.rows[2].y);
    check('tradition presets pick their motifs', m.tradBorders.map(function (b) { return b.motif; }).join(',') === Object.keys(Mk.traditions).map(function (t) { return Mk.traditions[t].motifs[0]; }).join(','));
    var stepFn = Mk.stepped('none', 1, 4);
    check('stepped ease quantises', stepFn(0.3) === 0.25 && stepFn(0.99) === 0.75 && stepFn(1) === 1);
    var scratch = document.createElement('div');
    document.getElementById('root').appendChild(scratch);
    var heroOk = Mk.heroicIds.length === Mk.figureIds.length && Mk.heroicIds.every(function (hid, i) {
      var base = Mk.figureIds[i];
      var c = Mk.puppet(scratch, { figure: base, look: 'paper', h: 200 });
      var hs = ['silhouette', 'leather', 'paper', 'painted'].map(function (look) { return Mk.puppet(scratch, { figure: hid, look: look, h: 200 }); });
      var sameJoints = hs.every(function (h) { return Object.keys(h.pivots).join() === Object.keys(c.pivots).join(); });
      return sameJoints && hs[0].meta.build === 'heroic' && hs[0].meta.id === hid && c.meta.build === 'classic';
    });
    check('heroic builds: every figure, every look, same joints as classic', heroOk);
    var torsoW = function (id) { var p = Mk.puppet(scratch, { figure: id, h: 400 }); return Math.round(p.part('torso').querySelector(':scope > path').getBBox().width); };
    check('heroic torsos are broader', torsoW('rama-heroic') > torsoW('rama') * 1.15 && torsoW('hanuman-heroic') > torsoW('hanuman'), torsoW('rama') + ' vs ' + torsoW('rama-heroic'));
    // Human build: every figure in every look, the shared front-view joints, painted layers, live clips.
    var looks = ['silhouette', 'leather', 'paper', 'painted', 'illustrated'], humanBad = [];
    Mk.human.ids.forEach(function (hid) {
      looks.forEach(function (look) {
        var hp = Mk.puppet(scratch, { figure: hid, look: look, h: 300 });
        var need = ['head', 'torso', 'pelvis', 'arm-r', 'arm-l', 'fore-r', 'fore-l'];
        need.forEach(function (j) { if (!hp.part(j)) humanBad.push(hid + '/' + look + ': no ' + j); });
        if (hp.meta.build !== 'human' || hp.meta.view !== 'front' || !hp.meta.name) humanBad.push(hid + ': meta');
        var paths = hp.art.querySelectorAll('path').length, spec = Mk.figures[hid]();
        var keepPaths = spec.parts.reduce(function (n, pt) { return n + (pt.keep ? (pt.layers || []).length : 0); }, 0);
        if (look === 'silhouette' && paths !== Object.keys(hp.groups).length + keepPaths) humanBad.push(hid + ': silhouette drew layers (' + paths + ')');
        if (look === 'illustrated' && paths < Object.keys(hp.groups).length * 3) humanBad.push(hid + ': illustrated has too few layers (' + paths + ')');
        Array.prototype.forEach.call(hp.art.querySelectorAll('[clip-path]'), function (g) {
          var id = /url\(#([^)]+)\)/.exec(g.getAttribute('clip-path'));
          if (!id || !document.getElementById(id[1])) humanBad.push(hid + ': dangling clip ' + g.getAttribute('clip-path'));
        });
      });
    });
    check('human figures: every look, front joints, layers and clips', humanBad.length === 0 && Mk.human.ids.length >= 8, humanBad.slice(0, 4).join(' / '));
    var hr = Mk.puppet(scratch, { figure: 'rama-human', look: 'illustrated', h: 300 });
    var tl2 = gsap.timeline({ paused: true });
    Mk.pose(tl2, hr, 0, { 'fore-r': -40, head: 4 }, { duration: 1 });
    tl2.seek(1, false);
    check('human figures pose on their joints', Math.round(gsap.getProperty(hr.part('fore-r'), 'rotation')) === -40);
    var opts = [['rama-human', { tone: 'brown', attire: 'royal' }, 'crown'], ['hanuman-human', { form: 'dasa' }, 'hand-r'], ['tirthankara-human', { emblem: 'snake' }, 'hoods'], ['ganesha-human', { tone: 'gold' }, 'trunk']];
    // Armoury: every weapon and aura builds; a placed weapon carries its transform; heroic figures have an aura kept in every look.
    var W = Mk.weapons, armBad = [];
    W.ids.forEach(function (wid) {
      var parts = W.place(W[wid]({}), { id: wid, at: [100, 300], angle: 30, scale: 0.8 });
      var wp = Mk.puppet(scratch, { figure: { viewBox: [200, 600], parts: parts }, look: 'illustrated', h: 200 });
      var inner = wp.part(wid).querySelector(':scope > g[transform]');
      if (!inner || !/rotate\(30\)/.test(inner.getAttribute('transform'))) armBad.push(wid + ': no transform');
      if (wp.art.querySelectorAll('path').length < 3) armBad.push(wid + ': too few paths');
    });
    Mk.auras.kinds.forEach(function (k) { if (Mk.auras.make(k, { cx: 100, cy: 100, r: 90 }).length !== 3) armBad.push('aura ' + k); });
    ['rama-human', 'hanuman-human', 'shiva-human', 'ganesha-human', 'athena-human', 'odin-human'].forEach(function (hid) {
      var hs = Mk.puppet(scratch, { figure: hid, look: 'silhouette', h: 200 });
      var aura = hs.part('aura') && hs.part('aura').querySelector(':scope > path');
      if (!aura || !/url\("?#mx-grad-/.test(aura.style.fill)) armBad.push(hid + ': aura not kept in silhouette');
      if (!hs.part('aura-rays') || !hs.part('aura-ring')) armBad.push(hid + ': aura parts missing');
    });
    check('armoury: weapons placed with transforms, auras kept in every look', armBad.length === 0 && W.ids.length >= 20, armBad.slice(0, 4).join(' / '));
    // Proportions: every standing heroic figure within the figure canon (figure-design.md section 8).
    var propBad = [];
    [['rama-human', 'male'], ['rama-human', 'male', { attire: 'royal' }], ['hanuman-human', 'titan'], ['hanuman-human', 'titan', { form: 'dasa' }], ['shiva-human', 'male'], ['athena-human', 'female'], ['odin-human', 'male']].forEach(function (c) {
      var spec = Mk.figures[c[0]](c[2] || {});
      spec.parts = spec.parts.filter(function (pt) { return pt.id.indexOf('aura') !== 0; });
      var mp = Mk.puppet(scratch, { figure: spec, look: 'illustrated', h: 820 });
      var res = FigureMeasure.measure(mp, c[1]);
      if (res.issues.length) propBad.push(c[0] + (c[2] ? JSON.stringify(c[2]) : '') + ': ' + res.issues.join(', '));
    });
    check('standing heroic figures within the proportion canon', propBad.length === 0, propBad.slice(0, 3).join(' / '));
    check('human figure options build their variants', opts.every(function (c) { var v = Mk.puppet(scratch, { figure: Mk.figures[c[0]](c[1]), look: 'illustrated', h: 200 }); return !!v.part(c[2]); }));
    scratch.remove();
    window.__mythicResults = { results: results, geometry: geometry() };
  }
  var tries = 0;
  (function poll() {
    if (root.getAttribute('data-studio-ready') === 'true' || root.getAttribute('data-studio-error') || tries > 200) { run(); return; }
    tries++;
    document.fonts.ready.then(function () { window.requestAnimationFrame(poll); });
  })();
})();
</script>
</body>
</html>
