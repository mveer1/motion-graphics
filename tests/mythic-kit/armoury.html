<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mythic armoury: weapons and auras</title>
  <link rel="stylesheet" href="/src/studio/studio-base.css">
  <link rel="stylesheet" href="/src/studio/styles/mythic-paper.css">
  <style>:root{--w:1800px;--h:1300px;--u:14px;--safe-top:40px;--safe-right:40px;--safe-bottom:40px;--safe-left:40px;}
    body{margin:0}
    .lab{position:absolute;text-align:center;font:600 15px 'EB Garamond',serif;color:var(--c-ink)}</style>
  <script src="/src/studio/vendor/gsap.min.js"></script>
</head>
<body>
<!-- Review sheet for src/studio/kits/mythic/armoury.js: every weapon on one scale, then every aura. -->
<div id="root" data-composition-id="root" data-format="landscape" data-width="1800" data-height="1300" data-fps="30" data-duration="1"></div>
<script src="/src/studio/studio-core.js"></script>
<script src="/src/studio/studio-draw.js"></script>
<script src="/src/studio/studio-type.js"></script>
<script src="/src/studio/studio-motion.js"></script>
<script src="/src/studio/studio-compositions.js"></script>
<script src="/src/studio/kits/mythic/mythic.js"></script>
<script src="/src/studio/kits/mythic/figures.js"></script>
<script src="/src/studio/kits/mythic/figures-human.js"></script>
<script src="/src/studio/kits/mythic/armoury.js"></script>
<script>
Studio.build(function (tl, f, S) {
  var M = S.kit.mythic, root = document.getElementById('root'), W = M.weapons;
  // [id, options, grip y in a 900-unit-tall cell, scale]
  var row1 = [['kodanda', {}, 450, 1], ['gada', {}, 700, 1], ['trishula', {}, 520, 0.9], ['dory', {}, 640, 0.75], ['gungnir', {}, 600, 0.8], ['shara', { glow: true }, 480, 1.2], ['tuna', {}, 450, 1.2], ['mjolnir', {}, 520, 1.6], ['khadga', {}, 620, 1.4]];
  var row2 = [['damaru', {}, 450, 2], ['ankusha', {}, 520, 1.6], ['pasha', {}, 480, 1.8], ['parashu', {}, 560, 1.4], ['chakra', {}, 450, 1.8], ['shankha', {}, 450, 2], ['vajra', {}, 450, 2], ['keraunos', {}, 450, 1.8], ['venu', {}, 450, 1.6], ['padma', {}, 520, 1.8], ['aspis', {}, 450, 1.2]];
  function sheet(row, top, cellH, n) {
    var cw = 1760 * 900 / (n * cellH);
    row.forEach(function (c, i) {
      var parts = W.place(W[c[0]](c[1]), { id: c[0], at: [cw / 2, c[2]], scale: c[3] });
      M.puppet(root, { figure: { viewBox: [cw, 900], parts: parts, meta: { name: c[0] } }, look: 'illustrated', h: cellH, x: 20 + i * cw * cellH / 900, y: top });
      var l = S.el('div', 'lab', c[0], root); l.style.left = (20 + i * cw * cellH / 900) + 'px'; l.style.width = (cw * cellH / 900) + 'px'; l.style.top = (top + cellH - 4) + 'px';
    });
  }
  sheet(row1, 10, 560, 9);
  sheet(row2, 600, 300, 11);
  var kinds = M.auras.kinds;
  kinds.forEach(function (k, i) {
    var parts = M.auras.make(k, { cx: 120, cy: 120, r: 110 });
    M.puppet(root, { figure: { viewBox: [240, 240], parts: parts, meta: { name: k } }, look: 'illustrated', h: 240, x: 30 + i * 250, y: 920 });
    var l = S.el('div', 'lab', k, root); l.style.left = (30 + i * 250) + 'px'; l.style.width = '240px'; l.style.top = '1166px';
  });
});
</script>
</body>
</html>
