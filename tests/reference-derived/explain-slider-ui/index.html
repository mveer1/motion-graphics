<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Golden scene: slider-driven counter and UI demo</title>
  <!--
    Golden scene for docs/explanation-devices.md. Copy the pattern, not the words.
      JOB trace-cause      -> DEVICE slider  (Studio.comp.slider: one input drives one output, end value held)
      JOB demo-interaction -> DEVICE ui-demo (Studio.comp.ui: input, cursor, button, toggle, notify; generic, unbranded)
    Maths: saving S a month for 10 years at 5% a year compounded monthly grows to S x ((1 + 0.05/12)^120 - 1) / (0.05/12)
    = S x 155.28, so $50 -> $7,764 and $300 -> $46,585 (rounded to the dollar). The caveat states the assumption.
    Original layout and copy; no reference footage, marks or shot sequences.
  -->
  <link rel="stylesheet" href="../../../src/studio/studio-base.css">
  <link rel="stylesheet" href="../../../src/studio/styles/editorial-light.css">
  <style id="studio-format">:root{--w:1280px;--h:720px;--u:7.2px;--safe-top:43px;--safe-right:64px;--safe-bottom:58px;--safe-left:64px;}</style>
  <style>
    .st-scene { background: var(--c-paper); }
    .stage { position: absolute; inset: 0; }
    .kick { position: absolute; left: var(--safe-left); top: var(--safe-top); }
    #titleA { position: absolute; left: var(--safe-left); top: calc(var(--safe-top) + var(--u) * 4); margin: 0; width: 80%; }
    #slider { position: absolute; left: 10%; right: 10%; top: 34%; }
    #slider .st-slider-out { font-size: calc(var(--u) * 14); }
    #slider .st-slider-in { font-size: calc(var(--u) * 7); }
    #slider .st-slider-label { font-size: calc(var(--u) * 3); }
    #slider .st-slider-track { height: calc(var(--u) * 1.8); }
    #titleB { position: absolute; left: var(--safe-left); top: calc(var(--safe-top) + var(--u) * 4); margin: 0; }
    #panel { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) scale(1.45); width: 60%; padding: calc(var(--u) * 4); box-sizing: border-box;
      border-radius: calc(var(--u) * 2); background: var(--c-paper-2); border: 1px solid var(--c-rule); display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
    .bar { display: flex; gap: calc(var(--u) * 2); align-items: center; }
    .bar .st-ui-input { flex: 1; }
    .opt { display: flex; align-items: center; justify-content: space-between; font: 600 calc(var(--u) * 2.8) / 1 var(--font-text); color: var(--c-ink); }
    #note { position: absolute; right: var(--safe-right); top: calc(var(--safe-top) + var(--u) * 2); }
    #layer { position: absolute; inset: 0; pointer-events: none; }
  </style>
  <script src="../../../src/studio/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="root" data-format="landscape" data-width="1280" data-height="720" data-fps="30" data-duration="14.8">
  <div class="st-scene" id="sceneA">
    <div class="stage" id="stageA">
      <div class="st-kicker kick">Money, part 3</div>
      <h2 class="st-title" id="titleA">Save a little more each month</h2>
      <div id="slider"></div>
    </div>
  </div>
  <div class="st-scene" id="sceneB">
    <div class="stage" id="stageB">
      <div class="st-kicker kick">Money, part 3</div>
      <h2 class="st-title" id="titleB">Set it once</h2>
      <div id="panel">
        <div class="bar" id="bar"></div>
        <div class="opt"><span>Move it on payday</span><span id="togHost"></span></div>
      </div>
      <div id="note"></div>
    </div>
    <div id="layer"></div>
  </div>
</div>
<script src="../../../src/studio/studio-core.js"></script>
<script src="../../../src/studio/studio-draw.js"></script>
<script src="../../../src/studio/studio-type.js"></script>
<script src="../../../src/studio/studio-motion.js"></script>
<script src="../../../src/studio/studio-compositions.js"></script>
<script src="../../../src/studio/studio-explain.js"></script>
<script>
Studio.build(function (tl, f, S) {
  var C = S.comp;
  var at = S.cues({ save: 0.6, more: 2.2, tenYears: 4.6, assume: 5.0, setOnce: 7.4, type: 8.2, press: 10.0, payday: 11.0, done: 12.0 });

  // Scene A. JOB trace-cause -> slider: the handle drags on "more"; the end value is held for 2 s before the caveat.
  S.show(tl, '#sceneA', 0);
  S.space.drift(tl, '#stageA', 0, 7.6, { startScale: 1, endScale: 1.03 });
  tl.fromTo('#titleA', { autoAlpha: 0, y: S.u(1.5) }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out', immediateRender: true }, 0.2);
  var slider = C.slider('#slider', {
    min: 0, max: 500, value: 50, step: 10, map: function (v) { return v * 155.282; },
    input: { label: 'Each month', prefix: '$' }, output: { label: 'After 10 years', prefix: '$' },
    caveat: 'Assumes 5% a year'
  });
  slider.enter(tl, at('save'));
  slider.drag(tl, at('more'), { to: 300 });
  slider.caveat(tl, at('assume'));

  // Scene B. JOB demo-interaction -> ui-demo: type, move, click, toggle, confirm; one action per spoken step.
  S.crossfade(tl, '#sceneA', '#sceneB', at('setOnce', -0.2), 0.4);
  S.space.drift(tl, '#stageB', 7.2, 14.8, { startScale: 1, endScale: 1.025 });
  var input = C.ui.input('#bar', { placeholder: 'Amount', text: '$300 every month' });
  var btn = C.ui.button('#bar', { label: 'Save rule' });
  var tog = C.ui.toggle('#togHost', { on: false });
  var cursor = C.ui.cursor('#layer');
  var note = C.ui.notify('#note', { title: 'Rule saved', body: '$300 moves on the 1st' });
  input.type(tl, at('type'), { cps: 16 });
  cursor.enter(tl, at('type', 0.4), { x: f.width * 0.42, y: f.height * 0.78 });
  cursor.moveTo(tl, btn.el, at('press', -0.7), { duration: 0.6 });
  cursor.click(tl, at('press'));
  btn.press(tl, at('press'));
  cursor.moveTo(tl, tog.el, at('payday', -0.5), { duration: 0.5 });
  cursor.click(tl, at('payday'));
  tog.flip(tl, at('payday'), true);
  note.enter(tl, at('done'));
});
</script>
</body>
</html>
