<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Golden scene: canvas camera tour, empty-stage dip, single-stage progression</title>
  <!--
    Golden scene for docs/explanation-devices.md. Copy the pattern, not the words.
      JOB process-step (spatial)  -> DEVICE canvas-tour     (Studio.space.tour: frame each panel, drift, pull back)
      JOB change-chapter          -> DEVICE empty-stage-dip (Studio.fx.dip: title start on the next phrase's first word)
      JOB process-step (on stage) -> DEVICE progression     (Studio.comp.progression: one focus change per step)
    The background grid drifts for the whole film, so the 0.25 s empty stage of the dip is never a frozen frame.
    Original layout and copy; no reference footage, marks or shot sequences.
  -->
  <link rel="stylesheet" href="../../../src/studio/studio-base.css">
  <link rel="stylesheet" href="../../../src/studio/styles/editorial-light.css">
  <style id="studio-format">:root{--w:1280px;--h:720px;--u:7.2px;--safe-top:43px;--safe-right:64px;--safe-bottom:58px;--safe-left:64px;}</style>
  <style>
    #root { background: var(--c-paper); overflow: hidden; }
    #bg { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%;
      background-image: radial-gradient(var(--c-rule) 1.4px, transparent 1.6px); background-size: 36px 36px; opacity: 0.7; }
    .st-scene { background: transparent; }
    .kick { position: absolute; left: var(--safe-left); top: var(--safe-top); z-index: 5; }
    #canvas { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; }
    .panel { position: absolute; width: 560px; height: 340px; border-radius: 28px; background: var(--c-paper-2); border: 3px solid var(--c-ink);
      box-sizing: border-box; padding: 40px; font-family: var(--font-text); color: var(--c-ink); }
    .panel h3 { margin: 0 0 16px; font: 800 56px/1 var(--font-display); }
    .panel p { margin: 0; font: 500 30px/1.35 var(--font-text); color: var(--c-ink-2); }
    #pClient { left: 160px; top: 160px; }
    #pQueue { left: 1000px; top: 560px; border-color: var(--c-accent-2); }
    #pWorker { left: 1840px; top: 940px; border-color: var(--c-accent); }
    #wires { position: absolute; left: 0; top: 0; overflow: visible; }
    #packet { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--c-accent-3); }
    #titleB { position: absolute; left: var(--safe-left); top: calc(var(--safe-top) + var(--u) * 4); margin: 0; }
    #items { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); display: flex; gap: calc(var(--u) * 4); }
    .card { width: calc(var(--u) * 32); height: calc(var(--u) * 26); border-radius: calc(var(--u) * 2); background: var(--c-paper-2); border: calc(var(--u) * 0.4) solid var(--c-ink);
      display: flex; align-items: center; justify-content: center; font: 800 calc(var(--u) * 6.4) / 1 var(--font-display); color: var(--c-ink); box-sizing: border-box; }
    #ui { position: absolute; left: 10%; right: 10%; top: 76%; }
    #ui .st-prog-caption { font-size: calc(var(--u) * 4.4); }
  </style>
  <script src="../../../src/studio/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="root" data-format="landscape" data-width="1280" data-height="720" data-fps="30" data-duration="21.5">
  <div id="bg"></div>
  <div class="st-kicker kick" id="kick">Queues, part 1</div>
  <div class="st-scene" id="sceneA">
    <div id="canvas">
      <svg id="wires" width="2560" height="1440" viewBox="0 0 2560 1440" aria-hidden="true">
        <path d="M720 330 C 860 330, 860 730, 1000 730" fill="none" stroke="#94a3b8" stroke-width="6" stroke-dasharray="14 12"/>
        <path d="M1560 730 C 1700 730, 1700 1110, 1840 1110" fill="none" stroke="#94a3b8" stroke-width="6" stroke-dasharray="14 12"/>
      </svg>
      <div class="panel" id="pClient"><h3>Client</h3><p>Sends a job, then moves on.</p></div>
      <div class="panel" id="pQueue"><h3>Queue</h3><p>Holds jobs in order.</p></div>
      <div class="panel" id="pWorker"><h3>Worker</h3><p>Does the oldest job first.</p></div>
      <div id="packet"></div>
    </div>
  </div>
  <div class="st-scene" id="sceneB">
    <h2 class="st-title" id="titleB">Inside the worker</h2>
    <div id="items"><div class="card" id="c0">Read</div><div class="card" id="c1">Check</div><div class="card" id="c2">Write</div></div>
    <div id="ui"></div>
  </div>
</div>
<script src="../../../src/studio/studio-core.js"></script>
<script src="../../../src/studio/studio-draw.js"></script>
<script src="../../../src/studio/studio-type.js"></script>
<script src="../../../src/studio/studio-motion.js"></script>
<script src="../../../src/studio/studio-compositions.js"></script>
<script src="../../../src/studio/studio-explain.js"></script>
<script>
Studio.build(function (tl, f, S) {
  var C = S.comp;
  var at = S.cues({ client: 1.0, queue: 4.0, worker: 7.0, whole: 10.0, inside: 12.8, read: 14.6, check: 16.6, write: 18.6 });
  S.show(tl, '#sceneA', 0);
  // background vitality for the whole film (it carries the empty stage of the dip)
  tl.fromTo('#bg', { x: 0, y: 0 }, { x: -36, y: -18, duration: 21.5, ease: 'none', immediateRender: true }, 0);

  // JOB process-step (spatial) -> canvas-tour: the camera visits each panel on its spoken name, then pulls back.
  S.space.tour(tl, '#canvas', [
    { target: '#pClient', at: at('client', -0.4) },
    { target: '#pQueue', at: at('queue', -0.4) },
    { target: '#pWorker', at: at('worker', -0.4) }
  ], { pullBack: at('whole'), start: 'first' });
  // the job travels in canvas space while the camera follows it
  tl.fromTo('#packet', { x: 720, y: 330, autoAlpha: 0 }, { x: 720, y: 330, autoAlpha: 1, duration: 0.2, ease: 'none', immediateRender: true }, 2.4);
  tl.fromTo('#packet', { x: 720, y: 330 }, { x: 1000, y: 730, duration: 1.4, ease: 'power2.inOut', immediateRender: false }, 2.7);
  tl.fromTo('#packet', { x: 1000, y: 730 }, { x: 1560, y: 730, duration: 1.8, ease: 'power1.inOut', immediateRender: false }, 4.4);
  tl.fromTo('#packet', { x: 1560, y: 730 }, { x: 1840, y: 1110, duration: 1.4, ease: 'power2.inOut', immediateRender: false }, 6.3);
  tl.fromTo('#packet', { x: 1840, y: 1110 }, { x: 2120, y: 1110, duration: 3.2, ease: 'sine.inOut', immediateRender: false }, 7.8);

  // JOB change-chapter -> empty-stage-dip: the new title starts on "inside", the first word of the next phrase.
  S.fx.dip(tl, '#sceneA', '#sceneB', at('inside'));

  // JOB process-step (on stage) -> progression: each step names its change in the caption.
  var prog = C.progression('#ui', { items: ['#c0', '#c1', '#c2'], steps: [
    { focus: [0, 1, 2], caption: 'Three moves, for every job' },
    { focus: 0, caption: 'Read the job from the queue' },
    { focus: 1, caption: 'Check it is still wanted' },
    { focus: 2, caption: 'Write the result, then ask for the next' }
  ] });
  prog.to(tl, 1, at('read'));
  prog.to(tl, 2, at('check'));
  prog.to(tl, 3, at('write'));
  tl.fromTo('#items', { scale: 1 }, { scale: 1.03, duration: 8.7, ease: 'sine.inOut', immediateRender: false }, 12.8);
});
</script>
</body>
</html>
