<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Studio runtime checks: reference backlog techniques (runtime 1.17.0)</title>
  <!-- Studio.fx.flash, Studio.fx.containerTransform, Studio.type.scramble, Studio.type.strike / strikeCorrect and the
       subject caption lane. Loads the vendored GSAP, so it runs offline. Driven by tests/test-studio-runtime.py. -->
  <link rel="stylesheet" href="../../src/studio/studio-base.css">
  <link rel="stylesheet" href="../../src/studio/styles/editorial-light.css">
  <style id="studio-format">:root{--w:1280px;--h:720px;--u:7.2px;--safe-top:43px;--safe-right:64px;--safe-bottom:58px;--safe-left:64px;}</style>
  <style>
    .st-scene { background: var(--c-paper); }
    #tile { position: absolute; left: 900px; top: 300px; width: 120px; height: 120px; border-radius: 28px; background: #2f5d50; color: #fff; }
    #card { position: absolute; left: 100px; top: 120px; width: 1080px; height: 480px; border-radius: 12px; background: #2f5d50; color: #fff; }
    #wordD { position: absolute; left: 500px; top: 80px; }
    #code { position: absolute; left: 80px; top: 200px; font: 700 60px/1 monospace; }
    #claim { position: absolute; left: 80px; top: 320px; margin: 0; font: 700 48px/1.1 sans-serif; display: inline-block; white-space: nowrap; }
    #fix { position: absolute; left: 80px; top: 420px; margin: 0; font: 800 50px/1.1 sans-serif; white-space: nowrap; }
    #anchor { position: absolute; left: 800px; top: 260px; width: 160px; height: 100px; background: #d9a441; }
  </style>
  <script src="../../src/studio/vendor/gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="root" data-format="landscape" data-width="1280" data-height="720" data-fps="30" data-duration="8">
  <div class="st-scene" id="sceneA"><div id="tile">Go</div></div>
  <div class="st-scene" id="sceneB"><div id="card"><h2 class="inner">Inside</h2></div></div>
  <div class="st-scene" id="sceneC"><h1>Turn</h1></div>
  <div class="st-scene" id="sceneD">
    <h1 id="wordD">Next</h1>
    <div id="code">DECODE</div>
    <p id="claim">Not a week.</p>
    <p id="fix">About 6 minutes.</p>
    <div id="anchor"></div>
  </div>
</div>
<script src="../../src/studio/studio-core.js"></script>
<script src="../../src/studio/studio-draw.js"></script>
<script src="../../src/studio/studio-type.js"></script>
<script src="../../src/studio/studio-motion.js"></script>
<script src="../../src/studio/studio-compositions.js"></script>
<script>
var T = {};
Studio.build(function (tl, f, S) {
  S.show(tl, '#sceneA', 0);
  T.ct = S.fx.containerTransform(tl, '#tile', '#card', 1.0, { duration: 0.6, outTarget: '#sceneA', inTarget: '#sceneB' });
  T.flash1 = S.fx.flash(tl, '#sceneB', '#sceneC', 2.5, {});
  T.flash2 = S.fx.flash(tl, '#sceneC', '#sceneD', 3.0, { shape: 'radial', center: '#wordD', color: '#d9a441' });
  T.scr = S.type.scramble(tl, '#code', 3.2, { seed: 5 });
  T.sc = S.type.strikeCorrect(tl, '#claim', '#fix', 4.0, { cps: 40, read: 0.3 });
  var cues = [
    { start: 6.0, end: 6.8, text: 'This part', role: 'body', lane: 'subject', anchor: '#anchor' },
    { start: 7.0, end: 7.6, text: 'Lost anchor', role: 'body', lane: 'subject', anchor: '#nope' }
  ];
  T.caps = S.comp.captions(document.getElementById('root'), cues, {}).schedule(tl);
});
</script>
<script>
(function () {
  var results = [];
  function check(name, cond, detail) { results.push({ name: name, ok: !!cond, detail: detail === undefined ? '' : String(detail) }); }
  function near(a, b, tol) { return Math.abs(a - b) <= tol; }
  function vis(el) { var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0.01; }
  function $(s) { return document.querySelector(s); }
  function box(el) { var r = el.getBoundingClientRect(), o = $('#root').getBoundingClientRect(); return { x: r.left - o.left, y: r.top - o.top, w: r.width, h: r.height }; }
  function shownText(el) {
    return Array.prototype.map.call(el.querySelectorAll('.st-scr-slot'), function (slot) {
      var g = Array.prototype.filter.call(slot.children, vis);
      return g.length === 1 ? g[0].textContent : '?' + g.length;
    }).join('');
  }

  function run() {
    var tl = window.__timelines && window.__timelines.root;
    var err = $('#root').getAttribute('data-studio-error');
    if (!tl && !err) { setTimeout(run, 30); return; }
    check('build without error', !err, err);
    if (err) { window.__studioTestResults = results; return; }
    check('timeline within data-duration', tl.duration() <= 8 + 1e-3, tl.duration());

    // Container transform
    var proxy = $('.st-container'), tile = $('#tile'), card = $('#card');
    tl.seek(0.9);
    check('container: proxy hidden before the cue', !vis(proxy) && vis(tile));
    tl.seek(1.3);
    var pb = box(proxy);
    check('container: proxy mid-way between source and target', vis(proxy) && !vis(tile) && pb.w > 120 && pb.w < 1080, JSON.stringify(pb));
    check('container: source content fading out, target content not yet in',
      parseFloat(getComputedStyle(proxy.children[0]).opacity) < 0.05 && parseFloat(getComputedStyle(proxy.children[1]).opacity) < 0.05);
    check('container: source copy keeps its look (not unstyled)', getComputedStyle(proxy.children[0].firstChild).backgroundColor !== 'rgba(0, 0, 0, 0)' || getComputedStyle(proxy.children[0].firstChild).color === 'rgb(255, 255, 255)');
    tl.seek(1.599);
    var end = box(proxy), cb = box(card);
    check('container: proxy lands on the target box', near(end.x, cb.x, 1.5) && near(end.y, cb.y, 1.5) && near(end.w, cb.w, 1.5) && near(end.h, cb.h, 1.5), JSON.stringify([end, cb]));
    tl.seek(1.65);
    check('container: hand-off to the real target', !vis(proxy) && vis(card) && vis($('#sceneB')) && !vis($('#sceneA')));
    check('container: copies carry no ids', proxy.querySelectorAll('[id]').length === 0);

    // Flash
    var flashes = document.querySelectorAll('.st-flash');
    check('flash: two overlays', flashes.length === 2, flashes.length);
    tl.seek(2.51);
    check('flash: opaque on the cut, scenes swapped under it', vis(flashes[0]) && parseFloat(getComputedStyle(flashes[0]).opacity) > 0.99 && vis($('#sceneC')) && !vis($('#sceneB')));
    tl.seek(2.5 + 1 / 30 + 0.12);
    var mid = parseFloat(getComputedStyle(flashes[0]).opacity);
    check('flash: decaying after the hold', mid > 0.05 && mid < 0.6, mid);
    tl.seek(2.5 + 1 / 30 + 0.25 + 0.01);
    check('flash: gone after the decay', !vis(flashes[0]));
    check('flash: radial burst centred on the incoming word', /radial-gradient/.test(flashes[1].style.background), flashes[1].style.background);
    var guard = gsap.timeline({ paused: true }), threw = false;
    Studio.fx.flash(guard, null, null, 1.0); Studio.fx.flash(guard, null, null, 1.3); Studio.fx.flash(guard, null, null, 1.6);
    try { Studio.fx.flash(guard, null, null, 1.9); } catch (e) { threw = /WCAG/.test(e.message); }
    check('flash: a fourth flash within one second throws (WCAG 2.3.1)', threw);
    var ok = true;
    try { Studio.fx.flash(guard, null, null, 3.5); } catch (e) { ok = false; }
    check('flash: a flash a second later is allowed', ok);

    // Scramble
    var code = $('#code');
    check('scramble: accessible label is the word', code.getAttribute('aria-label') === 'DECODE');
    tl.seek(3.1);
    check('scramble: hidden before the cue', shownText(code) === '?0?0?0?0?0?0', shownText(code));
    tl.seek(3.3); var a = shownText(code);
    tl.seek(7.9); tl.seek(0); tl.seek(3.3);
    check('scramble: same glyphs on every seek (seeded, no callbacks)', shownText(code) === a && a.indexOf('?') < 0, a);
    tl.seek(3.2 + 0.25 + 0.04 * 2 + 0.01);
    var partial = shownText(code);
    check('scramble: locks left to right', partial.slice(0, 3) === 'DEC' && partial !== 'DECODE', partial);
    tl.seek(T.scr + 0.01);
    check('scramble: settles on the word', shownText(code) === 'DECODE', shownText(code));
    var fin = code.querySelector('.st-scr-final');
    check('scramble: settles to the text colour', getComputedStyle(fin).color === getComputedStyle(code).color, getComputedStyle(fin).color);

    // Strike and correct
    var claim = $('#claim'), strike = claim.querySelector('.st-strike-path');
    check('strike: path inside the claim (moves with it)', !!strike);
    tl.seek(T.sc.struck - 0.25);
    var len = strike.getTotalLength();
    check('strike: not drawn before its cue', parseFloat(getComputedStyle(strike).strokeDashoffset) > len * 0.9, getComputedStyle(strike).strokeDashoffset);
    tl.seek(T.sc.struck + 0.01);
    check('strike: fully drawn', parseFloat(getComputedStyle(strike).strokeDashoffset) < 1, getComputedStyle(strike).strokeDashoffset);
    tl.seek(T.sc.demoted - 0.31);
    var fixChars = $('#fix').querySelectorAll('.st-char');
    check('strike: correction hidden while the struck claim is read', Array.prototype.every.call(fixChars, function (c) { return !vis(c); }));
    tl.seek(T.sc.end + 0.01);
    check('strike: claim demoted', near(gsap.getProperty(claim, 'scale'), 0.55, 0.01) && parseFloat(getComputedStyle(claim).opacity) < 0.6);
    check('strike: correction typed in', fixChars.length > 10 && Array.prototype.every.call(fixChars, vis), fixChars.length);

    // Subject caption lane
    var caps = document.querySelectorAll('.st-caption');
    check('caption: subject lane kept when the anchor exists', caps[0].getAttribute('data-lane') === 'subject');
    check('caption: missing anchor falls back to lower', caps[1].getAttribute('data-lane') === 'lower');
    tl.seek(6.2);
    var cbx = box(caps[0]), an = box($('#anchor'));
    check('caption: visible during its cue', vis(caps[0]));
    check('caption: sits below the anchor', cbx.y >= an.y + an.h && cbx.y - (an.y + an.h) < 30, JSON.stringify([cbx, an]));
    check('caption: centred on the anchor', near(cbx.x + cbx.w / 2, an.x + an.w / 2, 1.5), JSON.stringify([cbx, an]));
    check('caption: inside the safe area', cbx.x >= 64 - 0.5 && cbx.x + cbx.w <= 1280 - 64 + 0.5 && cbx.y + cbx.h <= 720 - 58 + 0.5);

    // Seek-order independence across the whole film
    function state() {
      return Array.prototype.map.call(document.querySelectorAll('.st-scene, .st-flash, .st-container, .st-scr-glyph, .st-caption'), function (el) {
        var cs = getComputedStyle(el); return cs.visibility + ':' + (+cs.opacity).toFixed(3);
      }).join('|');
    }
    tl.seek(3.35); var s1 = state();
    tl.seek(7.5); tl.seek(0.2); tl.seek(3.35);
    check('seek order independent at 3.35', state() === s1);
    tl.seek(1.2); var s2 = state();
    tl.seek(6.5); tl.seek(1.2);
    check('seek order independent at 1.2', state() === s2);
    window.__studioTestResults = results;
  }
  run();
})();
</script>
</body>
</html>
