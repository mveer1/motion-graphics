<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Style sample: proof-canvas</title>
  <link rel="stylesheet" href="_studio/studio-base.css">
  <link rel="stylesheet" href="_studio/styles/abstract-geometric.css">
  <style id="studio-format">:root{--w:720px;--h:1280px;--u:7.2px;--safe-top:128px;--safe-right:72px;--safe-bottom:300px;--safe-left:43px;}</style>
  <style>
    /* proof-canvas sample: one triangle, constructed, then transformed so the reason is visible. */
    #root { background: var(--c-paper); }
    #art { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; }
    .edge { fill: none; stroke: var(--c-ink); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .guide { fill: none; stroke: var(--c-ink-2); stroke-width: 2.5; stroke-linecap: round; }
    .straight { fill: none; stroke: var(--c-ink); stroke-width: 6; stroke-linecap: round; }
    .wa { fill: var(--c-accent); }
    .wb { fill: var(--c-accent-2); }
    .wc { fill: var(--c-accent-3); }
    .ghost { opacity: 0.28; }
    .vl { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; fill: var(--c-ink); text-anchor: middle; dominant-baseline: central; }
    .vl-w { fill: #f4efe6; font-size: 26px; }
    .num { position: absolute; top: 790px; width: 200px; margin-left: -100px; text-align: center; font-family: 'Archivo Black', sans-serif; font-size: 46px; line-height: 1; color: var(--c-ink); }

    .kick { position: absolute; left: 43px; top: 140px; width: 605px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-accent-2); }
    .head { position: absolute; left: 43px; top: 180px; width: 605px; font-family: 'Archivo Black', sans-serif; font-size: 52px; line-height: 1.05; color: var(--c-ink); }
    .cap { position: absolute; left: 43px; top: 916px; width: 605px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 30px; line-height: 1.25; color: var(--c-ink); }
    .eq { position: absolute; left: 43px; top: 880px; width: 605px; font-family: 'Archivo Black', sans-serif; font-size: 54px; line-height: 1.05; color: var(--c-ink); white-space: nowrap; }
    .ca { color: var(--c-accent); } .cb { color: var(--c-accent-2); } .cc { color: #c98f00; }
    .tag { position: absolute; left: 43px; top: 1000px; width: 605px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.08em; color: var(--c-ink-2); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div id="root"
     data-composition-id="root"
     data-format="portrait"
     data-width="720"
     data-height="1280"
     data-fps="30"
     data-duration="22">

  <svg id="art" viewBox="0 0 720 1280" aria-hidden="true">
    <g id="hookG"></g>
    <g id="proof" style="opacity:0;visibility:hidden">
      <g id="wedges"></g>
      <path id="par" class="guide" d="M60 470 L660 470"/>
      <g id="arrows"></g>
      <path id="tri" class="edge"/>
      <path id="straight" class="straight" d="M70 470 L650 470" style="opacity:0;visibility:hidden"/>
      <g id="labels"></g>
    </g>
  </svg>

  <div class="num" id="n0" style="left:185px"><span>0</span>°</div>
  <div class="num" id="n1" style="left:510px"><span>0</span>°</div>
  <div class="kick" id="kick">A proof in four moves</div>
  <div class="head" id="head">Different triangles. Same total.</div>
  <div class="cap" id="c1">Call the three angles <b class="ca">a</b>, <b class="cb">b</b> and <b class="cc">c</b>.</div>
  <div class="cap" id="c2">Draw a line through the top, parallel to the base.</div>
  <div class="cap" id="c3">Turn <b class="ca">a</b> and <b class="cb">b</b> half a turn. They land beside <b class="cc">c</b>, on a straight line.</div>
  <div class="eq" id="eq"><span class="ca">a</span> + <span class="cb">b</span> + <span class="cc">c</span> = 180°</div>
  <div class="tag" id="tag" style="opacity:0;visibility:hidden">STYLE SAMPLE · proof-canvas v1 · abstract-geometric</div>
</div>

<script src="_studio/studio-core.js"></script>
<script src="_studio/studio-draw.js"></script>
<script src="_studio/studio-type.js"></script>
<script src="_studio/studio-motion.js"></script>
<script src="_studio/studio-compositions.js"></script>
<script>
Studio.build(function (tl, f, S) {
  var cue = S.cues({ s1: 0, s2: 4.0, s3: 8.6, s4: 12.6, s5: 17.4, end: 22 });
  var $ = function (id) { return document.getElementById(id); };
  var R = 64, N = 18;

  // ---- geometry: every shape is computed from the three vertices, so the apex can move later.
  function ang(p, q) { return Math.atan2(q[1] - p[1], q[0] - p[0]); }
  function wedge(c, a1, a2, r) {
    var d = Math.atan2(Math.sin(a2 - a1), Math.cos(a2 - a1));
    var s = 'M' + c[0].toFixed(2) + ' ' + c[1].toFixed(2);
    for (var i = 0; i <= N; i++) {
      var t = a1 + d * i / N;
      s += ' L' + (c[0] + r * Math.cos(t)).toFixed(2) + ' ' + (c[1] + r * Math.sin(t)).toFixed(2);
    }
    return s + ' Z';
  }
  function mid(c, a1, a2, r) {
    var d = Math.atan2(Math.sin(a2 - a1), Math.cos(a2 - a1)), t = a1 + d / 2;
    return [c[0] + r * Math.cos(t), c[1] + r * Math.sin(t)];
  }
  function shapes(A, B, C) {
    return {
      tri: 'M' + A[0] + ' ' + A[1] + ' L' + B[0] + ' ' + B[1] + ' L' + C[0] + ' ' + C[1] + ' Z',
      a: wedge(A, 0, ang(A, C), R), b: wedge(B, Math.PI, ang(B, C), R), c: wedge(C, ang(C, A), ang(C, B), R),
      a2: wedge(C, Math.PI, ang(C, A), R), b2: wedge(C, 0, ang(C, B), R),
      la: mid(A, 0, ang(A, C), R * 0.62), lb: mid(B, Math.PI, ang(B, C), R * 0.62), lc: mid(C, ang(C, A), ang(C, B), R * 0.62),
      la2: mid(C, Math.PI, ang(C, A), R * 0.62), lb2: mid(C, 0, ang(C, B), R * 0.62)
    };
  }
  var A = [120, 820], B = [600, 820], C1 = [400, 470], C2 = [250, 470];
  var g1 = shapes(A, B, C1), g2 = shapes(A, B, C2);

  function path(cls, d, parent) { return S.svg('path', { 'class': cls, d: d }, $(parent)); }
  function label(txt, p, parent, cls) {
    var t = S.svg('text', { 'class': 'vl' + (cls ? ' ' + cls : ''), x: p[0].toFixed(1), y: p[1].toFixed(1) }, $(parent));
    t.textContent = txt;
    return t;
  }
  $('tri').setAttribute('d', g1.tri);
  var wa = path('wa', g1.a, 'wedges'), wb = path('wb', g1.b, 'wedges'), wc = path('wc', g1.c, 'wedges');
  var wa2 = path('wa', g1.a, 'wedges'), wb2 = path('wb', g1.b, 'wedges');          // the copies that turn
  var wa3 = path('wa', g1.a2, 'wedges'), wb3 = path('wb', g1.b2, 'wedges');        // the copies, settled at the apex
  var la = label('a', g1.la, 'labels', 'vl-w'), lb = label('b', g1.lb, 'labels', 'vl-w'), lc = label('c', g1.lc, 'labels');
  var la3 = label('a', g1.la2, 'labels', 'vl-w'), lb3 = label('b', g1.lb2, 'labels', 'vl-w');
  [wa2, wb2, wa3, wb3, la3, lb3].forEach(function (el) { gsap.set(el, { autoAlpha: 0 }); });
  // Parallel marks: one chevron on the base, one on the new line.
  path('guide', 'M350 808 L364 820 L350 832', 'arrows');
  path('guide', 'M520 458 L534 470 L520 482', 'arrows');

  // Hook: two unlike triangles with their angles, each summing to 180.
  var hooks = [
    { v: [[70, 760], [300, 760], [215, 420]], x: 185 },
    { v: [[360, 760], [660, 760], [420, 650]], x: 510 }
  ];
  var hookParts = [];
  hooks.forEach(function (h, k) {
    var P = h.v, g = S.svg('g', null, $('hookG'));
    var ws = [
      S.svg('path', { 'class': 'wa', d: wedge(P[0], 0, ang(P[0], P[2]), 44) }, g),
      S.svg('path', { 'class': 'wb', d: wedge(P[1], Math.PI, ang(P[1], P[2]), 44) }, g),
      S.svg('path', { 'class': 'wc', d: wedge(P[2], ang(P[2], P[0]), ang(P[2], P[1]), 44) }, g)
    ];
    var e = S.svg('path', { 'class': 'edge', d: 'M' + P[0] + ' L' + P[1] + ' L' + P[2] + ' Z' }, g);
    var n = $('n' + k), span = n.querySelector('span');
    hookParts.push({ g: g, ws: ws, e: e, n: n, span: span, verts: P });
  });

  function lines(sel) { return S.type.split(sel, { type: 'lines', mask: 'lines' }).lines; }
  var kick = lines('#kick'), head = lines('#head'), c1 = lines('#c1'), c2 = lines('#c2'), c3 = lines('#c3'), eq = lines('#eq');

  // ---------------------------------------------------------------- s1 hook: two unlike triangles, one total
  hookParts.forEach(function (h, k) {
    S.draw.stroke(tl, h.e, cue('s1', 0.05 + k * 0.15), { duration: 0.8, ease: 'expo.out' });
    h.ws.forEach(function (w, i) {
      var v = h.verts[i];
      tl.fromTo(w, { scale: 0, svgOrigin: v[0] + ' ' + v[1] }, { scale: 1, svgOrigin: v[0] + ' ' + v[1], duration: 0.5, ease: 'expo.out' }, cue('s1', 1.3 + k * 0.2 + i * 0.12));
    });
    tl.fromTo(h.n, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, cue('s1', 2.2 + k * 0.2));
    S.type.count(tl, h.span, cue('s1', 2.2 + k * 0.2), { to: 180, duration: 1.0, ease: 'expo.out' });
  });
  S.type.rise(tl, kick, cue('s1', 0.3));
  S.type.rise(tl, head, cue('s1', 0.7));
  tl.fromTo('#hookG', { y: 0 }, { y: -10, duration: 3.6, ease: 'sine.inOut' }, cue('s1', 0.4));

  // ---------------------------------------------------------------- s2 setup: build one triangle and name its angles
  tl.fromTo(['#hookG', '#n0', '#n1'], { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.4, ease: 'power2.in', immediateRender: false }, cue('s2', -0.2));
  S.type.exit(tl, head, cue('s2', -0.3));
  S.show(tl, '#proof', cue('s2'));
  S.draw.stroke(tl, '#tri', cue('s2', 0.1), { duration: 1.4, ease: 'power2.inOut', slack: 0.1 });
  [[wa, A, la], [wb, B, lb], [wc, C1, lc]].forEach(function (w, i) {
    var t = cue('s2', 1.5 + i * 0.6);
    tl.fromTo(w[0], { scale: 0, svgOrigin: w[1][0] + ' ' + w[1][1] }, { scale: 1, svgOrigin: w[1][0] + ' ' + w[1][1], duration: 0.6, ease: 'expo.out' }, t);
    tl.fromTo(w[2], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, t + 0.25);
  });
  S.type.rise(tl, c1, cue('s2', 2.0));
  S.space.drift(tl, '#proof', cue('s2'), cue('s5'), { startScale: 1, endScale: 1.03, origin: '50% 60%' });

  // ---------------------------------------------------------------- s3 construct: the parallel line
  S.type.exit(tl, c1, cue('s3', -0.2));
  S.type.rise(tl, c2, cue('s3', 0.2));
  S.draw.stroke(tl, '#par', cue('s3', 0.3), { duration: 1.1, ease: 'power2.inOut' });
  S.draw.stroke(tl, '#arrows path', cue('s3', 1.7), { duration: 0.35, stagger: 0.5 });
  tl.fromTo([wa, wb], { opacity: 1 }, { opacity: 0.55, duration: 0.4, immediateRender: false }, cue('s3', 2.8));
  tl.fromTo([wa, wb], { opacity: 0.55 }, { opacity: 1, duration: 0.4, immediateRender: false }, cue('s3', 3.4));

  // ---------------------------------------------------------------- s4 turn: half-turns carry a and b up to the apex
  S.type.exit(tl, c2, cue('s4', -0.2));
  S.type.rise(tl, c3, cue('s4', 0.2));
  var mAC = ((A[0] + C1[0]) / 2) + ' ' + ((A[1] + C1[1]) / 2), mBC = ((B[0] + C1[0]) / 2) + ' ' + ((B[1] + C1[1]) / 2);
  [[wa2, mAC, 0.4], [wb2, mBC, 1.7]].forEach(function (w) {
    var t = cue('s4', w[2]);
    tl.fromTo(w[0], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, immediateRender: false }, t);
    tl.fromTo(w[0], { rotation: 0, svgOrigin: w[1] }, { rotation: 180, svgOrigin: w[1], duration: 1.2, ease: 'power3.inOut' }, t + 0.05);
  });
  tl.fromTo([wa, wb], { opacity: 1 }, { opacity: 0.3, duration: 0.4, immediateRender: false }, cue('s4', 0.4));
  // Swap the turned copies for copies drawn in place at the apex (same pixels), so the apex can move later.
  tl.fromTo([wa3, wb3, la3, lb3], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, immediateRender: false }, cue('s4', 3.0));
  tl.fromTo([wa2, wb2], { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.01, immediateRender: false }, cue('s4', 3.0));
  tl.fromTo('#par', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, immediateRender: false }, cue('s4', 3.3));
  S.show(tl, '#straight', cue('s4', 3.3));
  S.draw.stroke(tl, '#straight', cue('s4', 3.3), { duration: 0.8, ease: 'power2.inOut' });
  tl.fromTo([wa3, wc, wb3], { scale: 1, svgOrigin: C1[0] + ' ' + C1[1] }, { scale: 1.14, svgOrigin: C1[0] + ' ' + C1[1], duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false }, cue('s4', 4.1));

  // ---------------------------------------------------------------- s5 result: the claim over the final state; the apex keeps moving
  S.type.exit(tl, c3, cue('s5', -0.3));
  S.type.rise(tl, eq, cue('s5', 0.1));
  var moves = [['#tri', 'tri'], [wa, 'a'], [wb, 'b'], [wc, 'c'], [wa3, 'a2'], [wb3, 'b2']];
  var t0 = cue('s5', 1.0), dur = 3.2;
  moves.forEach(function (m) {
    tl.fromTo(m[0], { attr: { d: g1[m[1]] } }, { attr: { d: g2[m[1]] }, duration: dur, ease: 'sine.inOut', immediateRender: false }, t0);
  });
  [[la, 'la'], [lb, 'lb'], [lc, 'lc'], [la3, 'la2'], [lb3, 'lb2']].forEach(function (l) {
    tl.fromTo(l[0], { attr: { x: g1[l[1]][0], y: g1[l[1]][1] } }, { attr: { x: g2[l[1]][0], y: g2[l[1]][1] }, duration: dur, ease: 'sine.inOut', immediateRender: false }, t0);
  });
  tl.fromTo([wa, wb], { opacity: 0.3 }, { opacity: 1, duration: 0.5, immediateRender: false }, cue('s5', 0.6));
  tl.fromTo('#tag', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, cue('s5', 2.4));
});
</script>
</body>
</html>
