<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Binary Search in 20 Checks (directed)</title>
  <link rel="stylesheet" href="_studio/studio-base.css">
  <link rel="stylesheet" href="_studio/styles/editorial-light.css">
  <style id="studio-format">:root{--w:1280px;--h:720px;--u:7.2px;--safe-top:43px;--safe-right:64px;--safe-bottom:58px;--safe-left:64px;}</style>
  <style>
    .f { font-family: 'Inter', sans-serif; }
    #root { background: #fbfbfa; color: #1f1d1b; }
    .abs { position: absolute; }
    .field { position: absolute; left: 60px; top: 0; width: 1160px; height: 720px; }
    .bar { position: absolute; bottom: 150px; width: 5px; background: #1f1d1b; transform-origin: 50% 100%; }
    .bar.tgt { background: #f0a21a; }
    #count1, .cnt2 { left: 60px; top: 36px; font-size: 128px; font-weight: 800; line-height: 1; letter-spacing: -.03em; white-space: nowrap; }
    .cap { font-size: 30px; font-weight: 600; color: #4a4742; white-space: nowrap; }
    #mark1, #mark2 { position: absolute; bottom: 120px; width: 7px; height: 380px; background: #e8421e; box-shadow: 0 0 0 0 #e8421e; }
    #twenty { left: 0; width: 1280px; top: 120px; text-align: center; font-size: 330px; font-weight: 800; line-height: 1; letter-spacing: -.04em; color: #1f1d1b; }
    #ticks { left: 0; width: 1280px; top: 500px; text-align: center; font-size: 0; }
    .tick { display: inline-block; width: 30px; height: 30px; margin: 0 7px; background: #1f1d1b; border-radius: 4px; }
    #formula { left: 0; width: 1280px; top: 590px; text-align: center; font-size: 30px; font-family: 'IBM Plex Mono', monospace; color: #4a4742; }
    #lab3 { left: 0; width: 1280px; top: 440px; text-align: center; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div id="root"
     data-composition-id="root"
     data-format="landscape"
     data-width="1280"
     data-height="720"
     data-fps="30"
     data-duration="14">
  <section class="st-scene f" id="s1"><div class="abs" id="st1" style="inset:0"><div class="field" id="f1"></div><div id="mark1"></div>
    <div class="abs" id="count1">1,000,000</div><div class="abs cap" style="left:64px;top:170px">sorted items, one of them is the target</div></div></section>
  <section class="st-scene f" id="s2"><div class="abs" id="st2" style="inset:0"><div class="field" id="f2"></div><div id="mark2"></div></div>
    <div class="abs cnt2" id="c20">1,000,000</div><div class="abs cnt2" id="c21">500,000</div><div class="abs cnt2" id="c22">250,000</div><div class="abs cnt2" id="c23">125,000</div><div class="abs cnt2" id="c24">62,500</div>
    <div class="abs cap" id="cap2" style="left:64px;top:170px">check the middle, discard half</div></section>
  <section class="st-scene f" id="s3"><div class="abs" id="twenty">20</div><div class="abs cap" id="lab3">checks, at most</div><div class="abs" id="ticks"></div><div class="abs" id="formula">ceil( log2(1,000,000) ) = 20</div>
    <div class="abs" id="tbar" style="left:620px;bottom:0;width:40px;height:100px;background:#f0a21a;border-radius:6px 6px 0 0"></div></section>
</div>
<script src="_studio/studio-core.js"></script>
<script src="_studio/studio-draw.js"></script>
<script src="_studio/studio-type.js"></script>
<script src="_studio/studio-motion.js"></script>
<script src="_studio/studio-compositions.js"></script>
<script>
Studio.build(function (tl, f, S) {
  var $ = function (q) { return document.querySelector(q); };
  var N = 160, TG = 118, X0 = 0, STEP = 7.2; // 160 bars across 1,160 px; the target is bar 118
  function field(host, tag) {
    var h = '';
    for (var i = 0; i < N; i++) h += '<div class="bar ' + (i === TG ? 'tgt' : '') + ' b' + tag + '" id="b' + tag + i + '" style="left:' + (X0 + i * STEP) + 'px;height:' + (50 + i / (N - 1) * 330).toFixed(0) + 'px"></div>';
    $(host).innerHTML = h;
  }
  field('#f1', '1'); field('#f2', '2');
  var tx = 60 + TG * STEP + 2.5; // target x in px
  S.show(tl, '#s1', 0);
  S.cut(tl, '#s1', '#s2', 4.6);

  // ---- s1: a million items; the marker sweeps, accelerating, and hits the target as the cut lands
  tl.fromTo('.b1', { scaleY: 0 }, { scaleY: 1, duration: .5, ease: 'power3.out', stagger: .004, immediateRender: true }, 0);
  tl.fromTo('#count1', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .6, ease: 'power3.out', immediateRender: true }, .2);
  tl.fromTo('#mark1', { x: 60 }, { x: tx - 3.5, duration: 3.7, ease: 'power3.in', immediateRender: true }, .9);
  tl.fromTo('#mark1', { opacity: 0 }, { opacity: 1, duration: .2, immediateRender: true }, .9);
  tl.to('.b1', { backgroundColor: '#b9b5ae', duration: .3, stagger: { each: .0225, from: 'start', grid: 'auto' }, ease: 'none' }, .9);
  tl.fromTo('#st1', { scale: 1, transformOrigin: '50% 80%' }, { scale: 1.04, duration: 4.6, ease: 'power1.in', immediateRender: true }, 0);

  // ---- s2: each check discards half; the camera follows what remains
  var lo = 0, hi = N - 1, k = 0, cnt = ['500,000', '250,000', '125,000', '62,500'], times = [5.4, 6.4, 7.4, 8.4];
  tl.fromTo('.b2', { scaleY: 1, opacity: 1 }, { scaleY: 1, opacity: 1, duration: .01, immediateRender: true }, 4.6);
  tl.fromTo('#mark2', { x: 60 + (N / 2) * STEP, opacity: 0 }, { opacity: 1, duration: .25, immediateRender: true }, 4.7);
  tl.fromTo('#c20', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: .4, ease: 'power3.out', immediateRender: true }, 4.7);
  tl.fromTo('.cnt2:not(#c20)', { opacity: 0 }, { opacity: 0, duration: .01, immediateRender: true }, 0);
  var scale = 1, curLo = 0, curHi = N - 1;
  times.forEach(function (t, n) {
    var mid = Math.floor((curLo + curHi) / 2), drop;
    if (TG <= mid) { drop = [mid + 1, curHi]; curHi = mid; } else { drop = [curLo, mid]; curLo = mid + 1; }
    var ids = []; for (var i = drop[0]; i <= drop[1]; i++) ids.push('#b2' + i);
    tl.to('#mark2', { x: 60 + mid * STEP, duration: .3, ease: 'power2.out' }, t - .5);
    tl.to(ids, { scaleY: 0, opacity: 0, duration: .35, ease: 'power3.in', stagger: { each: .002, from: (TG <= mid ? 'end' : 'start') } }, t);
    scale *= 2;
    tl.to('#st2', { scaleX: Math.min(scale, 12), transformOrigin: tx + 'px 80%', duration: .8, ease: 'power3.inOut' }, t + .1);  // horizontal zoom only: the window widens, the bars never rise into the numeral
    tl.to('#c2' + n, { opacity: 0, y: -30, duration: .18, ease: 'power2.in' }, t - .05);
    tl.fromTo('#c2' + (n + 1), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .3, ease: 'power3.out', immediateRender: true }, t + .14);
  });
  tl.to('#cap2', { opacity: 0, duration: .3 }, 8.6);

  // ---- s3: the match-cut carries the target bar into a large amber bar, then 20 lands from oversize
  S.fx.matchCut(tl, '#b2' + TG, '#tbar', '#s2', '#s3', 9.4, { duration: .7 });
  tl.fromTo('#twenty', { scale: 3.0, opacity: 0, transformOrigin: '50% 50%' }, { scale: 1, opacity: 1, duration: .5, ease: 'power4.out', immediateRender: true }, 9.5);
  tl.fromTo('#lab3', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out', immediateRender: true }, 10.1);
  var th = ''; for (var q = 0; q < 20; q++) th += '<span class="tick" style="background:' + (q === 19 ? '#e8421e' : '#1f1d1b') + '"></span>';
  $('#ticks').innerHTML = th;
  tl.fromTo('.tick', { scale: 0, opacity: 0, transformOrigin: '50% 50%' }, { scale: 1, opacity: 1, duration: .2, ease: 'back.out(2)', stagger: .06, immediateRender: true }, 10.4);
  tl.fromTo('#formula', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out', immediateRender: true }, 11.9);
  tl.to('#tbar', { height: 160, duration: 2.2, ease: 'sine.inOut' }, 10.0);
  tl.to('#twenty', { scale: .86, y: -20, duration: 1.8, ease: 'sine.inOut', transformOrigin: '50% 50%' }, 12.2);
});
</script>
</body>
</html>
