<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weights That Read Like Code</title>
  <link rel="stylesheet" href="_studio/studio-base.css">
  <link rel="stylesheet" href="_studio/styles/editorial-light.css">
  <style id="studio-format">:root{--w:720px;--h:1280px;--u:7.2px;--safe-top:128px;--safe-right:72px;--safe-bottom:300px;--safe-left:43px;}</style>
  <style>
    /* One coordinate system: every layer is a full-frame 720x1280 SVG (portrait is the only format). */
    #root { background: #f4efe6; }
    .layer { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); }
    .st-scene { background: transparent; }
    #bg { z-index: 0; }
    #hud { z-index: 40; pointer-events: none; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .sans { font-family: 'Inter', sans-serif; }
    .serif { font-family: 'Playfair Display', serif; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div id="root"
     data-composition-id="root"
     data-format="portrait"
     data-width="720"
     data-height="1280"
     data-fps="30"
     data-duration="239.5">

  <svg class="layer" id="bg" viewBox="0 0 720 1280" aria-hidden="true"></svg>
  <section class="st-scene" id="s1"><svg class="layer" viewBox="0 0 720 1280" aria-label="Seventeen thousand numbers"></svg></section>
  <section class="st-scene" id="s2"><svg class="layer" viewBox="0 0 720 1280" aria-label="Written by descent"></svg></section>
  <section class="st-scene" id="s3"><svg class="layer" viewBox="0 0 720 1280" aria-label="Weight-space programming"></svg></section>
  <section class="st-scene" id="s4"><svg class="layer" viewBox="0 0 720 1280" aria-label="Read: which game"></svg></section>
  <section class="st-scene" id="s5"><svg class="layer" viewBox="0 0 720 1280" aria-label="Read: copying heads"></svg></section>
  <section class="st-scene" id="s6"><svg class="layer" viewBox="0 0 720 1280" aria-label="Fix: the car"></svg></section>
  <section class="st-scene" id="s7"><svg class="layer" viewBox="0 0 720 1280" aria-label="Write: from zero"></svg></section>
  <section class="st-scene" id="s8"><svg class="layer" viewBox="0 0 720 1280" aria-label="Write: Go"></svg></section>
  <section class="st-scene" id="s9"><svg class="layer" viewBox="0 0 720 1280" aria-label="Improve: the loop"></svg></section>
  <section class="st-scene" id="s10"><svg class="layer" viewBox="0 0 720 1280" aria-label="Improve: the edit"></svg></section>
  <section class="st-scene" id="s11"><svg class="layer" viewBox="0 0 720 1280" aria-label="Limits"></svg></section>
  <section class="st-scene" id="s12"><svg class="layer" viewBox="0 0 720 1280" aria-label="Read like a program"></svg></section>
  <svg class="layer" id="hud" viewBox="0 0 720 1280" aria-hidden="true"></svg>
</div>

<script src="_studio/studio-core.js"></script>
<script src="_studio/studio-draw.js"></script>
<script src="_studio/studio-type.js"></script>
<script src="_studio/studio-motion.js"></script>
<script src="_studio/studio-compositions.js"></script>
<script>
Studio.build(function (tl, f, S) {
  // ------------------------------------------------------------------ timing
  // Scene starts and ends from audio/timeline.json; offsets inside a scene are the measured
  // word onsets from audio/words.json (asr, clip-relative seconds).
  var SC = { s1: 0, s2: 11.975, s3: 24.625, s4: 43.5, s5: 61.5, s6: 84.03, s7: 106.4,
             s8: 130.22, s9: 150.85, s10: 172.07, s11: 196.35, s12: 217.3 };
  var SE = { s1: 11.475, s2: 24.125, s3: 43.0, s4: 61.0, s5: 83.53, s6: 105.9, s7: 129.72,
             s8: 150.35, s9: 171.57, s10: 195.85, s11: 216.8, s12: 236.43 };
  var END = 239.5;
  var ORDER = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8', 's9', 's10', 's11', 's12'];
  function cutAt(id) { return SC[id] - 0.25; }

  // ------------------------------------------------------------------ palette
  var C = { paper: '#f4efe6', paper2: '#ebe3d4', ink: '#1e1b16', ink2: '#5b5347', rule: '#cfc5b3',
            red: '#b8432a', blue: '#2d4fa3', gold: '#d9a441', green: '#2f7d4f', neu: '#e6ddcc' };
  function rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
  function mix(a, b, t) {
    var A = rgb(a), B = rgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  }
  function cmap(v) { v = Math.max(-1, Math.min(1, v)); return v >= 0 ? mix(C.neu, C.red, Math.pow(v, 0.75)) : mix(C.neu, C.blue, Math.pow(-v, 0.75)); }
  var rnd = S.rng(20261102);
  function gauss() { return (rnd() + rnd() + rnd() - 1.5) / 1.5; }
  function fmtW(v) { return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(3); }
  function comma(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // ------------------------------------------------------------------ DOM helpers
  var uid = 0;
  function E(tag, attrs, parent) { return S.svg(tag, attrs || {}, parent); }
  function G(parent, attrs) { return E('g', attrs || {}, parent); }
  function T(p, x, y, s, o) {
    o = o || {};
    var e = E('text', { x: x, y: y, 'class': o.cls || 'sans', 'font-size': o.size || 22, fill: o.fill || C.ink,
      'text-anchor': o.anchor || 'start', 'font-weight': o.weight || 400 }, p);
    if (o.ls) e.setAttribute('letter-spacing', o.ls);
    if (o.italic) e.setAttribute('font-style', 'italic');
    if (o.op !== undefined) e.setAttribute('opacity', o.op);
    e.textContent = s;
    return e;
  }
  function R(p, x, y, w, h, o) {
    o = o || {};
    var e = E('rect', { x: x, y: y, width: w, height: h, rx: o.rx || 0, fill: o.fill || 'none' }, p);
    if (o.stroke) { e.setAttribute('stroke', o.stroke); e.setAttribute('stroke-width', o.sw || 2); }
    if (o.dash) e.setAttribute('stroke-dasharray', o.dash);
    if (o.op !== undefined) e.setAttribute('opacity', o.op);
    return e;
  }
  function P(p, d, o) {
    o = o || {};
    var e = E('path', { d: d, fill: o.fill || 'none', stroke: o.stroke || C.ink, 'stroke-width': o.sw || 2.5,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
    if (o.dash) e.setAttribute('stroke-dasharray', o.dash);
    if (o.op !== undefined) e.setAttribute('opacity', o.op);
    return e;
  }
  function L(p, x1, y1, x2, y2, o) { return P(p, 'M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2, o); }
  function circ(p, cx, cy, r, o) {
    o = o || {};
    var e = E('circle', { cx: cx, cy: cy, r: r, fill: o.fill || C.ink }, p);
    if (o.stroke) { e.setAttribute('stroke', o.stroke); e.setAttribute('stroke-width', o.sw || 2); }
    if (o.op !== undefined) e.setAttribute('opacity', o.op);
    return e;
  }
  function defsOf(svg) { var d = svg.querySelector('defs'); return d || E('defs', {}, svg); }
  function svgOf(el) { return el.ownerSVGElement || el; }

  // ------------------------------------------------------------------ motion helpers
  function rise(el, t, d, dy) {
    tl.fromTo(el, { autoAlpha: 0, y: dy === undefined ? 16 : dy }, { autoAlpha: 1, y: 0, duration: d || 0.55, ease: 'power3.out', immediateRender: true }, t);
  }
  function appear(el, t, d, ease) {
    tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: d || 0.4, ease: ease || 'power2.out', immediateRender: true }, t);
  }
  function vanish(el, t, d) {
    tl.fromTo(el, { autoAlpha: 1 }, { autoAlpha: 0, duration: d || 0.35, ease: 'power2.in', immediateRender: false }, t);
  }
  function dim(el, t, to, d, from) {
    tl.fromTo(el, { opacity: from === undefined ? 1 : from }, { opacity: to, duration: d || 0.45, ease: 'power2.inOut', immediateRender: false }, t);
  }
  function pop(el, t, d) {
    tl.fromTo(el, { autoAlpha: 0, scale: 0.3, transformOrigin: '50% 50%' }, { autoAlpha: 1, scale: 1, duration: d || 0.4, ease: 'back.out(2.2)', immediateRender: true }, t);
  }
  function stamp(el, t, rot) {
    tl.fromTo(el, { autoAlpha: 0, scale: 1.7, rotation: (rot || -3) - 7, transformOrigin: '50% 50%' },
      { autoAlpha: 1, scale: 1, rotation: rot || -3, duration: 0.32, ease: 'power4.out', immediateRender: true }, t);
  }
  function fillTo(el, t, a, b, d, ease) {
    tl.fromTo(el, { fill: a }, { fill: b, duration: d || 0.4, ease: ease || 'power2.out', immediateRender: false }, t);
  }
  function draw(el, t, d, ease) {
    var len = Math.ceil(el.getTotalLength()) + 2;
    el.setAttribute('stroke-dasharray', len + ' ' + len);
    tl.fromTo(el, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: d || 0.8, ease: ease || 'power2.inOut', immediateRender: true }, t);
  }
  // Left-to-right reveal of a text (or group) through a growing clip rectangle; steps(n) types it.
  function wipeIn(el, t, d, steps) {
    var bb = el.getBBox();
    var id = 'clip' + (uid++);
    var cp = E('clipPath', { id: id, clipPathUnits: 'userSpaceOnUse' }, defsOf(svgOf(el)));
    var r = E('rect', { x: bb.x - 6, y: bb.y - 8, width: 0, height: bb.height + 16 }, cp);
    el.setAttribute('clip-path', 'url(#' + id + ')');
    tl.fromTo(r, { attr: { width: 0 } }, { attr: { width: bb.width + 12 }, duration: d || 0.5,
      ease: steps ? 'steps(' + steps + ')' : 'power2.out', immediateRender: true }, t);
    return r;
  }
  function typeIn(el, t, cps) { var n = Math.max(1, el.textContent.length); wipeIn(el, t, n / (cps || 34), n); return t + n / (cps || 34); }
  // Number roller for SVG text: pre-built intermediate values switched on the timeline.
  function roller(p, x, y, from, to, n, fmt, o) {
    var g = G(p), els = [];
    for (var i = 0; i < n; i++) {
      var q = i / (n - 1); q = 1 - Math.pow(1 - q, 2.2);
      els.push(T(g, x, y, fmt(from + (to - from) * q), o));
      if (i > 0) els[i].setAttribute('opacity', 0);
    }
    return { g: g, els: els, last: els[n - 1] };
  }
  function roll(r, t, d) {
    var n = r.els.length;
    for (var i = 1; i < n; i++) {
      var ti = t + d * (i / (n - 1));
      tl.fromTo(r.els[i], { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none', immediateRender: false }, ti);
      tl.fromTo(r.els[i - 1], { opacity: 1 }, { opacity: 0, duration: 0.001, ease: 'none', immediateRender: false }, ti);
    }
  }
  function swap(a, b, t, d) { vanish(a, t, d || 0.25); appear(b, t + (d || 0.25) * 0.6, d || 0.3); }
  function strike(p, el, t, color) {
    var bb = el.getBBox();
    var ln = L(p, bb.x - 4, bb.y + bb.height * 0.55, bb.x + bb.width + 4, bb.y + bb.height * 0.5, { stroke: color || C.red, sw: 4 });
    draw(ln, t, 0.35, 'power2.out');
    return ln;
  }
  // Camera: a slow push plus a slow vertical pan for each scene's whole span (two properties, one owner).
  function drift(g, id, s0, s1) {
    var a = Math.max(0, SC[id] - 0.5), b = SE[id] + 0.6;
    S.space.drift(tl, g, a, b, { startScale: s0 || 1, endScale: (s1 || 1.028) + 0.012, ease: 'none' });
    tl.fromTo(g, { y: 10 }, { y: -14, duration: b - a, ease: 'sine.inOut', immediateRender: true }, a);
  }
  function appearTo(el, t, op, d) { tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: op, duration: d || 0.3, ease: 'power2.out', immediateRender: true }, t); }
  // Ambient life on a matrix: n cells breathe between their value and a nearby one, finitely, inside [t0, t1].
  function shimmer(els, t0, t1, n, amp) {
    var pool = els.slice();
    for (var i = 0; i < Math.min(n, pool.length); i++) {
      var k = i + Math.floor(rnd() * (pool.length - i)), tmp = pool[i]; pool[i] = pool[k]; pool[k] = tmp;
      var e = pool[i], v = e.__v || 0, per = 0.9 + rnd() * 1.2, st = t0 + rnd() * per;
      var reps = Math.floor((t1 - st) / (per / 2));
      if (reps < 2) continue;
      if (reps % 2) reps -= 1;
      tl.fromTo(e, { fill: cmap(v) }, { fill: cmap(v + (rnd() < 0.5 ? -1 : 1) * (amp || 0.35)), duration: per / 2, yoyo: true, repeat: reps - 1, ease: 'sine.inOut', immediateRender: false }, st);
    }
  }
  function opShimmer(els, t0, t1, n, lo) {
    for (var i = 0; i < Math.min(n, els.length); i++) {
      var e = els[Math.floor(rnd() * els.length)], per = 1.0 + rnd() * 1.2, st = t0 + rnd() * per;
      var reps = Math.floor((t1 - st) / (per / 2)); if (reps % 2) reps -= 1;
      if (reps < 2) continue;
      tl.fromTo(e, { opacity: 1 }, { opacity: lo || 0.4, duration: per / 2, yoyo: true, repeat: reps - 1, ease: 'sine.inOut', immediateRender: false }, st);
    }
  }

  // A headline block: kicker (wipes in) and one or two title lines (rise).
  function header(p, kicker, lines, tK, tT, o) {
    o = o || {};
    var g = G(p);
    var k = T(g, 48, 214, kicker, { cls: 'sans', size: 20, weight: 700, ls: '0.12em', fill: o.kfill || C.red });
    wipeIn(k, tK, 0.55);
    var ts = [];
    (lines || []).forEach(function (l, i) {
      var e = T(g, 48, 266 + i * 52, l, { cls: 'serif', size: o.size || 44, weight: 700, fill: (o.fills && o.fills[i]) || C.ink });
      rise(e, (Array.isArray(tT) ? tT[i] : tT + i * 0.14));
      ts.push(e);
    });
    return { g: g, k: k, t: ts };
  }
  // A matrix of coloured cells; values[r][c] in [-1, 1].
  function cells(p, x, y, rows, cols, cw, ch, gap, val, o) {
    o = o || {};
    var g = G(p), out = [];
    for (var r = 0; r < rows; r++) {
      out.push([]);
      for (var c = 0; c < cols; c++) {
        var v = val(r, c);
        var e = R(g, x + c * (cw + gap), y + r * (ch + gap), cw, ch, { fill: o.blank ? C.paper2 : cmap(v), rx: o.rx || 1.5 });
        e.__v = v;
        out[r].push(e);
      }
    }
    return { g: g, m: out };
  }
  function flatten(m) { var a = []; m.forEach(function (row) { row.forEach(function (e) { a.push(e); }); }); return a; }

  function scene(id) { var svg = document.querySelector('#' + id + ' svg'); return { svg: svg, cam: G(svg), top: G(svg) }; }
  function at(id, t) { return SC[id] + t; }

  // ================================================================== background
  var bg = document.getElementById('bg');
  R(bg, 0, 0, 720, 1280, { fill: C.paper });
  var grid = G(bg, { opacity: 0.55 });
  for (var gx = 0; gx <= 720; gx += 36) L(grid, gx, -80, gx, 1360, { stroke: C.rule, sw: gx % 180 === 0 ? 1.2 : 0.6, op: gx % 180 === 0 ? 0.7 : 0.4 });
  for (var gy = -72; gy <= 1360; gy += 36) L(grid, 0, gy, 720, gy, { stroke: C.rule, sw: gy % 180 === 0 ? 1.2 : 0.6, op: gy % 180 === 0 ? 0.7 : 0.4 });
  tl.fromTo(grid, { y: 0 }, { y: 36, duration: 6, ease: 'none', repeat: Math.ceil(END / 6), immediateRender: true }, 0);
  [[36, 140], [684, 140], [36, 1010], [684, 1010]].forEach(function (pt) {
    L(bg, pt[0] - 9, pt[1], pt[0] + 9, pt[1], { stroke: C.ink2, sw: 1.4, op: 0.6 });
    L(bg, pt[0], pt[1] - 9, pt[0], pt[1] + 9, { stroke: C.ink2, sw: 1.4, op: 0.6 });
  });

  // ================================================================== HUD: chapter rail + experiment tag
  var hud = document.getElementById('hud');
  var rail = G(hud);
  var chipNames = ['READ', 'FIX', 'WRITE', 'IMPROVE', 'LIMITS'];
  var chips = [], cx = 48;
  chipNames.forEach(function (n) {
    var e = T(rail, cx, 166, n, { cls: 'sans', size: 20, weight: 700, ls: '0.08em', fill: C.ink });
    var w = e.getBBox().width;
    chips.push({ e: e, x: cx, w: w });
    cx += w + 22;
  });
  var under = R(rail, chips[0].x, 174, chips[0].w, 4, { fill: C.red, rx: 2 });
  var expTags = {}, expG = G(rail);
  ['1', '3', '4', '5', '6', '8', '7'].forEach(function (n) {
    expTags[n] = T(expG, 648, 166, 'EXP ' + n + ' / 8', { cls: 'mono', size: 20, weight: 700, anchor: 'end', fill: C.ink2, op: 0 });
  });
  var chapter = [ // scene -> [chip index, exp]
    ['s4', 0, '1'], ['s5', 0, '3'], ['s6', 1, '4'], ['s7', 2, '5'], ['s8', 2, '6'], ['s9', 3, '8'], ['s10', 3, '8'], ['s11', 4, '7']];
  tl.fromTo(rail, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: 'power2.out', immediateRender: true }, cutAt('s4'));
  vanish(rail, cutAt('s12'), 0.4);
  chips.forEach(function (c, i) { c.e.setAttribute('opacity', i === 0 ? 1 : 0.38); });
  var prev = null;
  chapter.forEach(function (ch) {
    var t = cutAt(ch[0]);
    if (prev) {
      if (prev[1] !== ch[1]) {
        dim(chips[prev[1]].e, t, 0.38, 0.3, 1);
        dim(chips[ch[1]].e, t, 1, 0.3, 0.38);
        tl.fromTo(under, { attr: { x: chips[prev[1]].x, width: chips[prev[1]].w } },
          { attr: { x: chips[ch[1]].x, width: chips[ch[1]].w }, duration: 0.45, ease: 'power3.inOut', immediateRender: false }, t);
      }
      if (prev[2] !== ch[2]) {
        tl.fromTo(expTags[prev[2]], { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t);
        tl.fromTo(expTags[ch[2]], { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t + 0.15);
      }
    } else {
      tl.fromTo(expTags[ch[2]], { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, t + 0.1);
    }
    prev = ch;
  });

  // ================================================================== scene switches
  // Hard cuts on the chapter verbs (READ, FIX, WRITE, IMPROVE, LIMITS); crossfades inside a chapter.
  S.show(tl, '#s1', 0);
  var CUTS = { s4: 1, s6: 1, s7: 1, s9: 1, s11: 1 };
  for (var si = 1; si < ORDER.length; si++) {
    var a = '#' + ORDER[si - 1], b = '#' + ORDER[si];
    if (CUTS[ORDER[si]]) S.cut(tl, a, b, cutAt(ORDER[si]));
    else S.crossfade(tl, a, b, cutAt(ORDER[si]), 0.5);
  }

  // ================================================================== s1 Seventeen thousand numbers
  (function () {
    var id = 's1', s = scene(id), t0 = SC[id];
    var cam = s.cam;
    // headline: the count rolls up while it is spoken
    var hg = G(s.top);
    var k = T(hg, 48, 214, 'RAW WEIGHTS · NO LABELS', { cls: 'sans', size: 20, weight: 700, ls: '0.12em', fill: C.red });
    wipeIn(k, 0, 0.45);
    var probe = T(hg, 48, 266, '17,253', { cls: 'serif', size: 46, weight: 700, op: 0 });
    var nw = probe.getBBox().width;
    var rl = roller(hg, 48 + nw, 266, 0, 17253, 16, comma, { cls: 'serif', size: 46, weight: 700, anchor: 'end' });
    rise(rl.g, 0, 0.3, 8);
    roll(rl, 0.39, 1.0);
    var nums = T(hg, 48 + nw + 12, 266, 'numbers.', { cls: 'serif', size: 46, weight: 700 });
    rise(nums, 0, 0.3);
    var q = T(hg, 48, 320, 'Which game?', { cls: 'serif', size: 46, weight: 700, fill: C.red, italic: true });
    rise(q, 2.42);

    // the wall of raw weights: on screen from frame 0, scrolling upward
    var wrap = G(cam);
    var clipId = 'wallclip';
    var cp = E('clipPath', { id: clipId, clipPathUnits: 'userSpaceOnUse' }, defsOf(s.svg));
    R(cp, 44, 352, 612, 640);
    var clipG = G(wrap, { 'clip-path': 'url(#' + clipId + ')' });
    var wall = G(clipG);
    var rows = 26, cols = 6, rectRows = [], txtRows = [];
    for (var r = 0; r < rows; r++) {
      var rg = G(wall), tg = G(wall);
      rectRows.push(rg); txtRows.push(tg);
      for (var c = 0; c < cols; c++) {
        var v = Math.max(-1, Math.min(1, gauss() * 0.75));
        R(rg, 52 + c * 100, 352 + r * 30, 94, 26, { fill: cmap(v), rx: 2 });
        T(tg, 60 + c * 100, 372 + r * 30, fmtW(v), { cls: 'mono', size: 20, fill: C.ink2 });
      }
      rg.setAttribute('opacity', 0);
    }
    tl.fromTo(wall, { y: 0 }, { y: -120, duration: 6.1, ease: 'none', immediateRender: true }, 0);
    // numbers become a heatmap, row by row
    for (r = 0; r < rows; r++) {
      tl.fromTo(rectRows[r], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out', immediateRender: false }, 3.85 + r * 0.055);
      dim(txtRows[r], 3.85 + r * 0.055, 0.22, 0.35);
    }
    var tagNL = T(cam, 648, 1000, 'labels: none · code: none', { cls: 'mono', size: 20, fill: C.ink2, anchor: 'end' });
    appear(tagNL, 4.0, 0.3);
    vanish(tagNL, 6.0, 0.3);
