<script>
Studio.build(function (tl, f, S) {
  // Cue map mirrors storyboard.json (pour = start of the liquid transition into s6).
  var cue = S.cues({ s1: 0, s2: 4.2, s3: 11.0, s4: 15.0, s5: 19.0, pour: 23.2, s6: 23.9, s7: 27.6, end: 31 });
  var C = { water: '#c9d3cf', brew: '#9e5f2a', chai: '#c68b55', pod: '#7f9a5e', ginger: '#e3c27c', leaf: '#4a3423' };
  var r2 = function (n) { return Math.round(n * 100) / 100; };

  // ------------------------------------------------------------ artwork (DOM before tweens)
  document.getElementById('counter').setAttribute('d', S.draw.handLine(5, 22, 336, 378, 336, { segments: 7, jitter: 0.006 }));

  var wave = function (level, phase) {
    return S.draw.wave(17, { width: 400, height: 400, level: level, phase: phase, amplitude: 3.2, points: 10 });
  };
  var liquid = document.getElementById('liquid');
  liquid.setAttribute('d', wave(0.84, 0));
  liquid.style.fill = C.water;

  // Steam strands share one command structure, so their variants can morph (organic-wobble).
  function steamPath(x0, y0, height, phase) {
    var a = 8 + 3 * Math.sin(phase * 1.7 + x0 * 0.05);
    var s = 4 * Math.sin(phase * 2.3 + x0 * 0.11);
    var y1 = y0 - height / 2, y2 = y0 - height;
    return 'M' + x0 + ' ' + y0 +
      ' C' + r2(x0 - a) + ' ' + r2(y0 - 18) + ' ' + r2(x0 + a + s) + ' ' + r2(y1 + 18) + ' ' + r2(x0 + s / 2) + ' ' + r2(y1) +
      ' C' + r2(x0 - a - s) + ' ' + r2(y1 - 18) + ' ' + r2(x0 + a) + ' ' + r2(y2 + 18) + ' ' + r2(x0 + s) + ' ' + r2(y2);
  }
  var STEAM_X = [165, 200, 235];
  STEAM_X.forEach(function (x, i) { document.getElementById('steam-' + (i + 1)).setAttribute('d', steamPath(x, 180, 110, i)); });

  var flameLayer = document.getElementById('flames');
  var flames = [150, 200, 250].map(function (x) {
    return S.svg('path', { 'class': 'flame', d: 'M' + x + ' 334 C' + (x - 8) + ' 326 ' + (x - 6) + ' 320 ' + x + ' 313 C' + (x + 6) + ' 320 ' + (x + 8) + ' 326 ' + x + ' 334 Z' }, flameLayer);
  });

  var SPICES = [
    { k: 'pod', x: 70, y: 150, r: -20 }, { k: 'pod', x: 120, y: 116, r: 18 }, { k: 'ginger', x: 164, y: 90, r: 0 },
    { k: 'ginger', x: 240, y: 86, r: 30 }, { k: 'pod', x: 284, y: 114, r: -12 }, { k: 'pod', x: 332, y: 148, r: 24 }
  ];
  var spiceLayer = document.getElementById('spices');
  var spices = SPICES.map(function (sp, i) {
    var base = S.svg('g', { transform: 'translate(' + sp.x + ' ' + sp.y + ')' }, spiceLayer);
    var g = S.svg('g', { 'class': 'spice' }, base);
    var rot = S.svg('g', { transform: 'rotate(' + sp.r + ')' }, g);
    if (sp.k === 'pod') {
      S.svg('path', { d: 'M-15 0 C-9 -9 9 -9 15 0 C9 9 -9 9 -15 0 Z', 'class': 'pod' }, rot);
      S.svg('path', { d: 'M-10 0 Q0 -2 10 0', 'class': 'ink-hair' }, rot);
    } else {
      S.svg('path', { d: S.draw.blob(31 + i, { r: 15, points: 7, wobble: 0.3 }), 'class': 'ginger' }, rot);
      S.svg('path', { d: 'M-6 -4 L5 3 M-3 6 L4 -5', 'class': 'ink-hair' }, rot);
    }
    return { g: g, x: sp.x, y: sp.y, k: sp.k };
  });
  var speckLayer = document.getElementById('specks');
  var specks = [];
  spices.forEach(function (sp, i) {
    specks = specks.concat(S.draw.particles(speckLayer, 4, 70 + i, {
      box: { x: sp.x - 14, y: sp.y - 6, width: 28, height: 12 }, minR: 1.2, maxR: 2.4, fill: sp.k === 'pod' ? C.pod : C.ginger
    }));
  });
  var bubblesA = S.draw.particles(document.getElementById('bubbles'), 7, 41, { box: { x: 128, y: 284, width: 144, height: 18 }, minR: 2, maxR: 3.6, className: 'bubble' });
  var bubblesB = S.draw.particles(document.getElementById('bubbles'), 7, 42, { box: { x: 128, y: 284, width: 144, height: 18 }, minR: 2, maxR: 3.6, className: 'bubble' });
  var leaves = S.draw.particles(document.getElementById('tea-leaves'), 16, 55, { box: { x: 150, y: 30, width: 100, height: 46 }, minR: 1.6, maxR: 3.1, fill: C.leaf });

  function glassMarkup(id, withSteam) {
    return '<svg viewBox="0 0 400 400" aria-hidden="true" id="glass-' + id + '">' +
      '<defs><clipPath id="glass-clip-' + id + '"><path d="M148 132 L161 316 Q162 326 173 326 L227 326 Q238 326 239 316 L252 132 Z"/></clipPath></defs>' +
      '<g data-fill clip-path="url(#glass-clip-' + id + ')"><rect class="chai-fill" x="140" y="158" width="120" height="190"/><path class="foam" d="M150 160 Q200 168 250 160"/></g>' +
      '<path class="ink" d="M146 128 L160 318 Q161 330 173 330 L227 330 Q239 330 240 318 L254 128"/>' +
      '<path class="ink" d="M140 128 L260 128"/>' +
      '<path class="ink-soft" d="M118 344 Q200 356 282 344"/>' +
      (withSteam ? '<path class="steam" data-no-draw id="gsteam-1"/><path class="steam" data-no-draw id="gsteam-2"/>' : '') +

  }
  document.getElementById('s6-glass-frame').innerHTML = glassMarkup('a', true);
  var GSTEAM_X = [186, 214];
  GSTEAM_X.forEach(function (x, i) { document.getElementById('gsteam-' + (i + 1)).setAttribute('d', steamPath(x, 118, 92, i + 3)); });

  // ------------------------------------------------------------ copy (split before any transform tween)
  var title = S.comp.titleCard(document.getElementById('s1-copy'), {
    kicker: 'A recipe in four steps',
    titleHTML: 'Masala <em>chai</em>',
    subtitle: 'Spiced milk tea for two, in about ten minutes.'
  });
  var s2heading = S.type.split('#s2-heading', { type: 'lines,words', mask: 'lines' });
  var list = S.comp.itemList(document.getElementById('s2-list'), [
    { qty: '1 cup', label: 'water' },
    { qty: '1 cup', label: 'whole milk' },
    { qty: '2 tsp', label: 'loose black tea' },
    { qty: '4', label: 'cardamom pods' },
    { qty: '1 inch', label: 'fresh ginger' },
    { qty: '2 tsp', label: 'sugar, to taste' }
  ], { columns: { landscape: 1, portrait: 1, square: 2 } });
  var steps = [
    S.comp.stepHeader(document.getElementById('s3-copy'), { index: 1, total: 4, title: 'Crush the spices', body: 'Lightly crush the cardamom and ginger to release their oils.' }),
    S.comp.stepHeader(document.getElementById('s4-copy'), { index: 2, total: 4, title: 'Simmer in water', body: 'Simmer the spices in the water for two minutes.' }),
    S.comp.stepHeader(document.getElementById('s5-copy'), { index: 3, total: 4, titleHTML: 'Add tea, then <em>milk</em>', body: 'Brew the tea for a minute. Add the milk; bring to a boil.' }),
    S.comp.stepHeader(document.getElementById('s6-copy'), { index: 4, total: 4, title: 'Strain and serve', body: 'Strain into two cups. Sweeten to taste.' })
  ];
  var end = S.comp.endCard(document.getElementById('s7'), { titleHTML: 'Chai, <em>slowly</em>.', lines: ['Serves 2 · About 10 minutes'] });
  var mark = S.el('div', 'st-end-mark');

  mark.innerHTML = glassMarkup('b', false);
  end.el.insertBefore(mark, end.el.firstChild);
  S.texture.grain(null, { opacity: 0.05, seed: 3 });

  // ------------------------------------------------------------ s1: title over a steaming pan
  S.show(tl, '#s1', cue('s1'));
  title.enter(tl, cue('s1', 0.2));
  var steamEls = ['#steam-1', '#steam-2', '#steam-3'];
  S.draw.stroke(tl, steamEls, cue('s1', 0.7), { duration: 0.9, stagger: 0.15, slack: 0.3 });

    S.draw.wobble(tl, steamEls[i], cue('s1', 1.9 + i * 0.1), cue('s2', -0.25), function (p) { return steamPath(x, 180, 110, i + p); }, { period: 0.8 });
  });
  tl.fromTo('#steam', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.45, ease: 'power1.in', immediateRender: false }, cue('s2', -0.25));

  list.enter(tl, cue('s2', 0.85), { stagger: 0.11 });

  S.space.camera(tl, '#art-frame', cue('s2', 0.3), { scale: 1.07, y: -8, duration: cue('pour') - cue('s2', 0.3), ease: 'sine.inOut' });

  S.type.exit(tl, s2heading.lines, cue('s3', -0.5));
  tl.fromTo('#s2-kicker', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, immediateRender: false }, cue('s3', -0.5));

  // ------------------------------------------------------------ s3: crush, then into the pan
  S.cut(tl, '#s2', '#s3', cue('s3'));
  steps[0].enter(tl, cue('s3', 0.1));
  var spiceGroups = spices.map(function (s) { return s.g; });

  tl.fromTo(spiceGroups, { scaleX: 1.3, scaleY: 0.55 }, { scaleX: 1, scaleY: 1, transformOrigin: '50% 100%', duration: 0.32, ease: 'back.out(2)', stagger: 0.08, immediateRender: false }, cue('s3', 1.25));

  tl.fromTo(spiceGroups,
    { x: 0, y: 0, scale: 1, autoAlpha: 1 },

      y: function (i) { return 262 - spices[i].y; },
      scale: 0.6, autoAlpha: 0, transformOrigin: '50% 50%', duration: 0.8, ease: 'power2.in', stagger: 0.06, immediateRender: false

  steps[0].exit(tl, cue('s4', -0.5));

  S.cut(tl, '#s3', '#s4', cue('s4'));

  S.draw.morph(tl, liquid, wave(0.75, 1), cue('s4', 0.3), { from: wave(0.84, 0), duration: 0.5, ease: 'power1.in' });
  S.draw.morph(tl, liquid, wave(0.66, 2), cue('s4', 0.8), { from: wave(0.75, 1), duration: 0.6, ease: 'power2.out' });

  flames.forEach(function (flame, i) {
    var start = cue('s4', 1.0 + i * 0.05);

    tl.fromTo(flame, { scaleY: 1 }, { scaleY: 0.78, transformOrigin: '50% 100%', duration: period, ease: 'sine.inOut', yoyo: true, repeat: reps, immediateRender: false }, start);
  });
  S.draw.drift(tl, bubblesA, cue('s4', 1.6), cue('s4', 2.7), { dy: -26, jitterX: 6, spread: 0.5, ease: 'power1.out' });
  S.draw.drift(tl, bubblesB, cue('s4', 2.5), cue('s4', 3.6), { dy: -26, jitterX: 6, spread: 0.5, ease: 'power1.out' });
  S.draw.wobble(tl, liquid, cue('s4', 1.5), cue('s5', -0.2), function (p) { return wave(0.66, 2 + p); }, { period: 0.7 });
  steps[1].exit(tl, cue('s5', -0.5));

  // ------------------------------------------------------------ s5: tea, then milk
  S.cut(tl, '#s4', '#s5', cue('s5'));
  steps[2].enter(tl, cue('s5', 0.1));
  S.draw.drift(tl, leaves, cue('s5', 0.3), cue('s5', 1.4), { dy: 190, jitterX: 14, spread: 0.45 });
  tl.fromTo(liquid, { fill: C.water }, { fill: C.brew, duration: 0.8, ease: 'power1.inOut', immediateRender: false }, cue('s5', 1.0));
  S.draw.stroke(tl, ['#milk-outline', '#milk'], cue('s5', 1.8), { duration: 0.45, stagger: 0, ease: 'power1.in' });
  tl.fromTo(liquid, { fill: C.brew }, { fill: C.chai, duration: 0.9, ease: 'power1.inOut', immediateRender: false }, cue('s5', 2.2));
  S.draw.morph(tl, liquid, wave(0.62, 7), cue('s5', 2.3), { from: wave(0.66, 2), duration: 0.4 });
  S.draw.morph(tl, liquid, wave(0.585, 8), cue('s5', 2.7), { from: wave(0.62, 7), duration: 0.5 });
  S.draw.erase(tl, ['#milk-outline', '#milk'], cue('s5', 3.1), { duration: 0.35 });
  S.draw.wobble(tl, liquid, cue('s5', 3.25), cue('pour', 0.35), function (p) { return wave(0.585, 8 + p); }, { period: 0.4 });

  // ------------------------------------------------------------ pour: the chai fills the frame
  S.fx.liquid(tl, '#s5', '#s6', cue('pour'), { color: C.chai, duration: 1.4, mode: 'drain', seed: 9 });
  S.hide(tl, '#art', cue('s6'));

  // ------------------------------------------------------------ s6: strain and serve
  steps[3].enter(tl, cue('s6', 0.6));
  S.draw.lineArt(tl, '#glass-a', cue('s6', 0.5), { order: 'top-down', speed: 600 });
  var glassSteam = ['#gsteam-1', '#gsteam-2'];
  S.draw.stroke(tl, glassSteam, cue('s6', 1.7), { duration: 0.8, stagger: 0.15, slack: 0.3 });
  GSTEAM_X.forEach(function (x, i) {
    S.draw.wobble(tl, glassSteam[i], cue('s6', 2.6 + i * 0.1), cue('s7', -0.1), function (p) { return steamPath(x, 118, 92, i + 3 + p); }, { period: 0.8 });
  });

  // ------------------------------------------------------------ s7: match cut into the end card
  S.fx.matchCut(tl, '#s6-glass-frame', '#s7-mark', '#s6', '#s7', cue('s7'), { duration: 0.9 });
  end.enter(tl, cue('s7', 0.05));
});
