<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Night the Fridges Warmed Up</title>
  <link rel="stylesheet" href="_studio/studio-base.css">
  <link rel="stylesheet" href="_studio/styles/data-journalism.css">
  <style id="studio-format">:root{--w:720px;--h:1280px;--u:7.2px;--safe-top:128px;--safe-right:72px;--safe-bottom:300px;--safe-left:43px;}</style>
  <style>
    /* Palette: cool white sheet, ink, and ONE temperature ramp (ultramarine -> marigold -> vermilion).
       The ramp encodes temperature everywhere in the film and nothing else. */
    :root {
      --c-paper: #FBFBFA;
      --c-paper-2: #F0EFEC;
      --c-ink: #17171A;
      --c-ink-2: #5B5B63;
      --c-rule: #D9D8D4;
      --c-cold: #1D5A8A;
      --c-warm: #E0A100;
      --c-hot: #C1272D;
    }
    body { background: var(--c-paper); }
    #root { background: var(--c-paper); overflow: hidden; }
    #bg { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; background: #F3F7FA; }
    #stage { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; }
    .h { opacity: 0; visibility: hidden; }
    .gfx { transform-box: fill-box; transform-origin: 50% 50%; }
    .dr { stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: butt !important; }

    /* Type. Families are named literally so the renderer injects the bundled fonts. */
    .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-ink-2); }
    .tn { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; dominant-baseline: central; }
    .sv-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; fill: var(--c-ink); letter-spacing: 0.06em; }
    .sv-serif { font-family: 'Playfair Display', serif; font-weight: 700; fill: var(--c-ink); }
    .sv-sans { font-family: 'Inter', sans-serif; font-weight: 600; fill: var(--c-ink-2); }

    .kick { position: absolute; left: 43px; top: 136px; width: 605px; font-size: 22px; white-space: nowrap; color: var(--c-ink-2); }
    #copy { position: absolute; left: 43px; top: 902px; width: 605px; height: 96px; }
    .cl { position: absolute; left: 0; top: 0; width: 605px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 39px; line-height: 1.12; letter-spacing: -0.01em; color: var(--c-ink); }
    #srcz { position: absolute; left: 43px; top: 1000px; width: 605px; height: 24px; }
    .sl { position: absolute; left: 0; top: 0; width: 605px; font-size: 19px; letter-spacing: 0.01em; text-transform: none; white-space: nowrap; }

    #hero { position: absolute; left: 43px; top: 150px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 150px; line-height: 1; color: var(--c-cold); letter-spacing: -0.02em; }
    #hero .unit { font-size: 54px; vertical-align: top; position: relative; top: 14px; margin-left: 6px; letter-spacing: 0; }
    #heroNote { position: absolute; left: 43px; top: 318px; font-size: 20px; white-space: nowrap; }
    #big700 { position: absolute; left: 43px; top: 150px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 150px; line-height: 1; color: var(--c-hot); letter-spacing: -0.02em; }
    #big700Note { position: absolute; left: 43px; top: 320px; font-size: 22px; white-space: nowrap; color: var(--c-ink); }

    .quote { position: absolute; left: 43px; width: 605px; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 38px; line-height: 1.1; color: var(--c-ink); }
    .quote small { display: block; font-family: 'JetBrains Mono', monospace; font-style: normal; font-weight: 500; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-ink-2); margin-top: 6px; }
    .chk { position: absolute; left: 43px; width: 605px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15; color: var(--c-ink); display: flex; gap: 16px; align-items: baseline; }
    .chk b { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; color: var(--c-cold); min-width: 34px; }
    #chkHead { position: absolute; left: 43px; top: 684px; font-size: 20px; white-space: nowrap; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<div id="root"
     data-composition-id="root"
     data-format="portrait"
     data-width="720"
     data-height="1280"
     data-fps="30"
     data-duration="92">

  <div id="bg"></div>
  <svg id="stage" viewBox="0 0 720 1280" aria-hidden="true">
    <defs>
      <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1D5A8A"/>
        <stop offset="0.55" stop-color="#E0A100"/>
        <stop offset="1" stop-color="#C1272D"/>
      </linearGradient>
      <clipPath id="barClip"><rect id="barClipRect" x="43" y="236" width="0" height="26"/></clipPath>
    </defs>
    <g id="gridPos"><g id="gridDrift"></g></g>
    <g id="overlay"></g>
  </svg>
  <div id="kickers"></div>
  <div id="hero" class="h"><span id="heroN">4</span><span class="unit">°C</span></div>
  <div id="heroNote" class="mono h">after about 6 hours</div>
  <div id="big700" class="h">0</div>
  <div id="big700Note" class="mono h">of about 10,000 supermarkets</div>
  <div id="copy"></div>
  <div id="srcz"></div>
  <div id="extras"></div>
</div>

<script src="_studio/studio-core.js"></script>
<script src="_studio/studio-draw.js"></script>
<script src="_studio/studio-type.js"></script>
<script src="_studio/studio-motion.js"></script>
<script src="_studio/studio-compositions.js"></script>
<script>
Studio.build(function (tl, f, S) {
  var T = S.type;
  var EO = 'power3.out', EIO = 'power2.inOut';
  var C = {
    cold: '#E7EEF4', frozen: '#CFE0EE', blue: '#1D5A8A', mid: '#E0A100', midLine: '#B97F00',
    hot: '#C1272D', hotLine: '#8E1B20', ink: '#17171A', ink2: '#5B5B63', paper: '#FBFBFA',
    paper2: '#F0EFEC', rule: '#D9D8D4', white: '#FFFFFF'
  };
  var rng = S.rng(2611);
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), overlay = $('overlay');

  // ---------------------------------------------------------------- helpers
  function g(parent, id, cls) { var e = S.svg('g', id ? { id: id } : {}, parent); if (cls) e.setAttribute('class', cls); return e; }
  function sv(tag, attrs, parent, cls) { var e = S.svg(tag, attrs, parent); if (cls) e.setAttribute('class', cls); return e; }
  function svText(parent, str, attrs, cls) { var e = sv('text', attrs, parent, cls); e.textContent = str; return e; }

  // Entrance / exit: the element starts hidden through the .h class (visibility + opacity).
  function appear(target, at, o) {
    o = o || {};
    tl.fromTo(target, { autoAlpha: 0, y: o.y === undefined ? 14 : o.y, scale: o.scale === undefined ? 1 : o.scale },
      { autoAlpha: 1, y: 0, scale: 1, duration: o.dur || 0.5, ease: o.ease || EO, immediateRender: false }, at);
  }
  function fadeIn(target, at, dur) {
    tl.fromTo(target, { autoAlpha: 0 }, { autoAlpha: 1, duration: dur || 0.4, ease: 'power1.out', immediateRender: false }, at);
  }
  function fadeOut(target, at, dur) {
    tl.fromTo(target, { autoAlpha: 1 }, { autoAlpha: 0, duration: dur || 0.35, ease: 'power1.in', immediateRender: false }, at);
  }
  // Stroke draw-on for elements with pathLength=1 (class .dr).
  function drawOn(target, at, dur) {
    tl.fromTo(target, { autoAlpha: 1, strokeDashoffset: 1 }, { autoAlpha: 1, strokeDashoffset: 0, duration: dur || 0.6, ease: 'power2.inOut', immediateRender: false }, at);
  }

  // Integer counter bound to an element property; immediateRender is off so the order of
  // reset/warm/cool tweens on the same element stays seek-safe.
  function bindNum(el, init, suffix) {
    var v = init;
    Object.defineProperty(el, '__n', {
      configurable: true,
      get: function () { return v; },
      set: function (x) {
        v = x;
        var r = Math.round(x);
        el.textContent = (r < 0 ? '−' : '') + Math.abs(r) + (suffix || '');
      }
    });
  }
  function count(el, at, from, to, dur, ease) {
    tl.fromTo(el, { __n: from }, { __n: to, duration: dur, ease: ease || 'power1.in', immediateRender: false }, at);
  }

  // Expanding ring on a tile, animated through geometry attributes (no transform origin involved).
  function pulseRing(parent, t, stroke, at, scaleTo) {
    var w0 = TW + 8, h0 = TH + 8, cx = t.x + TW / 2, cy = t.y + TH / 2;
    var e = sv('rect', { x: cx - w0 / 2, y: cy - h0 / 2, width: w0, height: h0, rx: 10, fill: 'none', stroke: stroke, 'stroke-width': 3 }, parent, 'h');
    var w1 = w0 * scaleTo, h1 = h0 * scaleTo;
    tl.fromTo(e, { autoAlpha: 0.9, attr: { x: cx - w0 / 2, y: cy - h0 / 2, width: w0, height: h0, rx: 10 } },
      { autoAlpha: 0, attr: { x: cx - w1 / 2, y: cy - h1 / 2, width: w1, height: h1, rx: 10 * scaleTo }, duration: 0.9, ease: 'power2.out', immediateRender: false }, at);
    return e;
  }

  // ---------------------------------------------------------------- measured speech cues (audio/timeline.json + silencedetect)
  var A = {
    s1: [0.27, 2.13, 6.82, 9.8, 11.14], s2: [14.18, 15.5, 19.9, 21.68], s3: [26.67, 29.56, 32.05, 36.71, 40.6],
    s4: [44.61, 48.06, 50.15, 51.71, 53.28, 56.96], s5: [61.31, 63.59, 68.61], s6: [75.1, 76.33, 80.5, 82.19, 86.41]
  };

  // ---------------------------------------------------------------- copy / source / kicker lines
  var copyZ = $('copy'), srcZ = $('srcz'), kickZ = $('kickers');
  function lines(items, endAt) {
    items.forEach(function (it, i) {
      var next = i + 1 < items.length ? items[i + 1].t - 0.1 : endAt;
      var d = S.el('div', 'cl h', null, copyZ); d.innerHTML = it.h;
      appear(d, it.t, { y: 16, dur: 0.5 });
      fadeOut(d, next, 0.25);
      if (it.s) {
        var s = S.el('div', 'sl mono h', it.s, srcZ);
        fadeIn(s, it.t + 0.2, 0.4); fadeOut(s, next, 0.25);
      }
    });
  }
  function kicker(text, at, until) {
    var k = S.el('div', 'kick mono h', text, kickZ);
    tl.fromTo(k, { autoAlpha: 0, clipPath: 'inset(0 100% 0 0)' },
      { autoAlpha: 1, clipPath: 'inset(0 0% 0 0)', duration: 0.05 + text.length * 0.035, ease: 'steps(' + text.length + ')', immediateRender: false }, at);
    fadeOut(k, until, 0.25);
  }

  // ---------------------------------------------------------------- THE GRID (96 fridge tiles)
  var gridPos = $('gridPos'), gridDrift = $('gridDrift');
  var COLS = 8, ROWS = 12, PX = 75.6, PY = 57, TW = 66, TH = 48;
  var ORIGIN = { r: 5, c: 3 };
  var tiles = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var frozen = (r % 3 === 2);
      var x = c * PX, y = r * PY;
      var gt = g(gridDrift);
      var rc = sv('rect', { x: x, y: y, width: TW, height: TH, rx: 7, fill: frozen ? C.frozen : C.cold, stroke: C.blue, 'stroke-width': 2 }, gt);
      sv('line', { x1: x + 57, y1: y + 14, x2: x + 57, y2: y + 34, stroke: C.ink2, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0.35 }, gt);
      var tx = svText(gt, '', { x: x + 31, y: y + 25, 'text-anchor': 'middle', fill: C.blue }, 'tn');
      bindNum(tx, frozen ? -18 : 4); tx.textContent = frozen ? '−18' : '4';
      var dr = Math.sqrt(Math.pow(r - ORIGIN.r, 2) + Math.pow(c - ORIGIN.c, 2));
      tiles.push({ r: r, c: c, g: gt, rc: rc, tx: tx, frozen: frozen, d: dr, x: x, y: y, j: rng.range(-0.12, 0.12), hotN: rng.int(46, 54) });
    }
  }
  var originTile = tiles.filter(function (t) { return t.r === ORIGIN.r && t.c === ORIGIN.c; })[0];

  function coldFill(t) { return t.frozen ? C.frozen : C.cold; }
  function coldN(t) { return t.frozen ? -18 : 4; }

  // cold -> marigold -> vermilion over `dur`, number counting up as it goes
  function warm(t, at, dur, hotN) {
    var h = dur * 0.5;
    tl.fromTo(t.rc, { fill: coldFill(t), stroke: C.blue }, { fill: C.mid, stroke: C.midLine, duration: h, ease: 'none', immediateRender: false }, at);
    tl.fromTo(t.rc, { fill: C.mid, stroke: C.midLine }, { fill: C.hot, stroke: C.hotLine, duration: dur - h, ease: 'none', immediateRender: false }, at + h);
    tl.fromTo(t.tx, { fill: C.blue }, { fill: C.ink, duration: h, ease: 'none', immediateRender: false }, at);
    tl.fromTo(t.tx, { fill: C.ink }, { fill: C.white, duration: dur - h, ease: 'none', immediateRender: false }, at + h);
    count(t.tx, at, coldN(t), hotN, dur, 'power1.in');
  }
  function cool(t, at, dur) {
    var h = dur * 0.5;
    tl.fromTo(t.rc, { fill: C.hot, stroke: C.hotLine }, { fill: C.mid, stroke: C.midLine, duration: h, ease: 'none', immediateRender: false }, at);
    tl.fromTo(t.rc, { fill: C.mid, stroke: C.midLine }, { fill: coldFill(t), stroke: C.blue, duration: dur - h, ease: 'none', immediateRender: false }, at + h);
    tl.fromTo(t.tx, { fill: C.white }, { fill: C.ink, duration: h, ease: 'none', immediateRender: false }, at);
    tl.fromTo(t.tx, { fill: C.ink }, { fill: C.blue, duration: dur - h, ease: 'none', immediateRender: false }, at + h);
    count(t.tx, at, t.hotN, coldN(t), dur, 'power1.out');
  }
  function setCold(t, at) {
    tl.fromTo(t.rc, { fill: C.hot, stroke: C.hotLine }, { fill: coldFill(t), stroke: C.blue, duration: 0.001, immediateRender: false }, at);
    tl.fromTo(t.tx, { fill: C.white }, { fill: C.blue, duration: 0.001, immediateRender: false }, at);
    tl.fromTo(t.tx, { __n: t.hotN }, { __n: coldN(t), duration: 0.001, immediateRender: false }, at);
  }
  // hot tile -> empty outline (stock discarded)
  function empty(t, at, dur) {
    tl.fromTo(t.rc, { fill: C.hot, stroke: C.hotLine }, { fill: C.paper, stroke: '#B8B7B2', duration: dur, ease: 'power1.inOut', immediateRender: false }, at);
    tl.fromTo(t.tx, { autoAlpha: 1 }, { autoAlpha: 0, duration: dur * 0.6, ease: 'none', immediateRender: false }, at);
  }
  function setFull(t, at) {
    tl.fromTo(t.rc, { fill: C.paper, stroke: '#B8B7B2' }, { fill: C.hot, stroke: C.hotLine, duration: 0.001, immediateRender: false }, at);
    tl.fromTo(t.tx, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, immediateRender: false }, at);
  }

  // Grid placement per scene (outer group owns layout, inner group owns drift).
  var G1 = { x: 48, y: 205, s: 1 }, G4 = { x: 145, y: 385, s: 0.72 }, G6 = { x: 151, y: 190, s: 0.7 };
  gsap.set(gridPos, { x: G1.x, y: G1.y, scale: G1.s, svgOrigin: '0 0' });
  gsap.set(gridDrift, { svgOrigin: '298 340' });
  function placeGrid(G, at, F) {
    tl.fromTo(gridPos, { x: F.x, y: F.y, scale: F.s }, { x: G.x, y: G.y, scale: G.s, duration: 0.001, immediateRender: false }, at);
  }

  // ================================================================ SCENE 1  (0 - 13.4)  four degrees
  kicker('SUN 11 OCT 2026 · FRANCE', 0.4, 13.2);
  // continuous drift while the grid is cold
  tl.fromTo(gridDrift, { scale: 1 }, { scale: 1.03, duration: 6.4, ease: 'none', immediateRender: false }, 0);
  tl.fromTo(gridDrift, { scale: 1.03 }, { scale: 1.0, duration: 6.2, ease: 'power1.inOut', immediateRender: false }, 6.6);
  // rings on one chilled and one frozen tile
  function ring(t, at, until) {
    var rr = sv('rect', { x: t.x - 6, y: t.y - 6, width: TW + 12, height: TH + 12, rx: 11, fill: 'none', stroke: C.ink, 'stroke-width': 3, pathLength: 1 }, gridDrift, 'dr h');
    drawOn(rr, at, 0.55); fadeOut(rr, until, 0.3);
  }
  var chilled = tiles.filter(function (t) { return t.r === 1 && t.c === 1; })[0];
  var frozenT = tiles.filter(function (t) { return t.r === 2 && t.c === 5; })[0];
  ring(chilled, 3.2, 6.2); ring(frozenT, 4.6, 6.2);
  // the first tile ticks up; the wave follows
  [0, 1].forEach(function (k) { pulseRing(gridDrift, originTile, C.hot, 6.1 + k * 0.5, 2.4); });
  warm(originTile, 6.1, 3.4, 52); originTile.hotN = 52;
  tiles.forEach(function (t) {
    if (t === originTile) return;
    warm(t, 6.7 + t.d * 0.2 + t.j, 1.7, t.hotN);
  });
  // background warms with the wave, then relaxes for the explainer scenes
  tl.fromTo('#bg', { backgroundColor: '#F3F7FA' }, { backgroundColor: '#FBF4E8', duration: 3.4, ease: 'none', immediateRender: false }, 7.0);
  tl.fromTo('#bg', { backgroundColor: '#FBF4E8' }, { backgroundColor: '#FBFBFA', duration: 0.9, ease: 'none', immediateRender: false }, 13.5);
  // told to warm up: the origin tile pulses
  tl.fromTo(originTile.g, { scale: 1 }, { scale: 1.12, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 3, immediateRender: false }, 11.2);
  gsap.set(originTile.g, { transformOrigin: '50% 50%' });
  lines([
    { t: 2.13, h: 'Fridges at 4°. Freezers at −18°.', s: 'Typical chilled and frozen set points' },
    { t: 6.82, h: 'By Monday, hundreds of stores threw it all out.', s: 'Intermarché, Coopérative U, E.Leclerc (AFP)' },
    { t: 9.8, h: 'Nobody had broken in.' },
    { t: 11.14, h: 'The machines were told to warm up.' }
  ], 13.3);

  // ================================================================ SCENE 2  (13.4 - 25.9)  a feature, not a bug
  var ob = S.boxAt(tl, originTile.rc, 13.35);
  var caseG = g(overlay, 'caseG', 'h');
  var heroRect = sv('rect', { x: ob.x, y: ob.y, width: ob.w, height: ob.h, rx: 7, fill: C.hot, stroke: C.hotLine, 'stroke-width': 2 }, caseG);
  tl.fromTo(caseG, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001, ease: 'none', immediateRender: false }, 13.4);
  fadeOut(gridPos, 13.42, 0.7);
  tl.fromTo(heroRect, { attr: { x: ob.x, y: ob.y, width: ob.w, height: ob.h, rx: 7 }, fill: C.hot, stroke: C.hotLine, strokeWidth: 2 },
    { attr: { x: 100, y: 250, width: 520, height: 400, rx: 22 }, fill: C.paper, stroke: C.ink, strokeWidth: 4, duration: 0.9, ease: EIO, immediateRender: false }, 13.5);
  kicker('HOW A FREEZER DEFROSTS', 14.0, 25.7);

  var cut = g(overlay, 'cutG', 'h');
  // evaporator coil (serpentine)
  var coilD = 'M150 300 H570 A22 22 0 0 1 570 344 H150 A22 22 0 0 0 150 388 H570';
  var heat = sv('path', { d: coilD, fill: 'none', stroke: C.mid, 'stroke-width': 16, 'stroke-linecap': 'round', opacity: 0.85, pathLength: 1 }, cut, 'dr h');
  var coil = sv('path', { d: coilD, fill: 'none', stroke: C.ink2, 'stroke-width': 7, 'stroke-linecap': 'round', pathLength: 1 }, cut, 'dr h');
  svText(cut, 'COIL', { x: 150, y: 274, 'font-size': 18 }, 'sv-mono h cLbl');
  var frost = [];
  [300, 344, 388].forEach(function (yy, ri) {
    for (var i = 0; i < 15; i++) {
      var fx = 160 + i * 28 + rng.range(-6, 6), up = (i + ri) % 2 === 0;
      var fc = sv('circle', { cx: fx, cy: yy + (up ? -13 : 13) + rng.range(-3, 3), r: rng.range(5, 9), fill: '#DCEAF5', stroke: C.blue, 'stroke-width': 1.5 }, cut, 'gfx h');
      frost.push(fc);
    }
  });
  // shelves and food
  sv('line', { x1: 112, y1: 516, x2: 608, y2: 516, stroke: C.rule, 'stroke-width': 3 }, cut, 'h shelf');
  sv('line', { x1: 112, y1: 622, x2: 608, y2: 622, stroke: C.rule, 'stroke-width': 3 }, cut, 'h shelf');
  var food = [];
  [[440, 'a'], [546, 'b']].forEach(function (row, ri) {
    for (var i = 0; i < 6; i++) {
      var fr = sv('rect', { x: 134 + i * 76, y: row[0] + (i % 2 ? 8 : 0), width: 60, height: 70 - (i % 2 ? 8 : 0), rx: 8, fill: '#D6E4EF', stroke: C.blue, 'stroke-width': 2 }, cut, 'h');
      food.push({ e: fr, k: ri * 6 + i });
    }
  });
  // drips
  var drips = [];
  for (var di = 0; di < 9; di++) {
    var dpx = 170 + di * 48 + rng.range(-8, 8);
    var dp = sv('path', { d: 'M' + dpx + ' 401 C' + (dpx + 5) + ' 408 ' + (dpx + 6) + ' 413 ' + dpx + ' 416 C' + (dpx - 6) + ' 413 ' + (dpx - 5) + ' 408 ' + dpx + ' 401 Z', fill: C.blue }, cut, 'h');
    drips.push(dp);
  }
  // cycle bar
  svText(cut, 'DEFROST CYCLE', { x: 100, y: 782, 'font-size': 18 }, 'sv-mono h cLbl');
  var track = sv('rect', { x: 100, y: 796, width: 520, height: 34, rx: 8, fill: C.paper2, stroke: C.rule, 'stroke-width': 2 }, cut, 'h');
  var barShort = sv('rect', { x: 100, y: 796, width: 40, height: 34, rx: 8, fill: C.mid }, cut, 'h');
  var barLong = sv('rect', { x: 100, y: 796, width: 40, height: 34, rx: 8, fill: C.hot }, cut, 'h');
  var ticks = [];
  for (var k = 0; k <= 8; k += 2) {
    ticks.push(sv('line', { x1: 100 + k * 65, y1: 836, x2: 100 + k * 65, y2: 848, stroke: C.ink2, 'stroke-width': 2 }, cut, 'h'));
    ticks.push(svText(cut, k + (k === 8 ? ' h' : ''), { x: 100 + k * 65, y: 872, 'text-anchor': 'middle', 'font-size': 17 }, 'sv-mono h'));
  }
