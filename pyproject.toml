[project]
name = "motion-lab"
version = "0.1.0"
description = "Reproducible low-memory technical motion graphics production pipeline on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "soundfile>=0.12.1",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "librosa>=0.10.1",
    "pyloudnorm>=0.1.1",
    "jsonschema>=4.21.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "pillow>=10.2.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

